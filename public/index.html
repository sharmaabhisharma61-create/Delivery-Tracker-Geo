    return (
      '<table class="roles-table"><thead><tr><th>Role</th><th>Assigned</th><th></th></tr></thead><tbody id="roles-body">' + rows + '</tbody></table>' +
      '<button type="button" class="btn btn-sm btn-outlined ring-focus" data-action="add-role">' + ICON_ADD + ' Add role</button>' +
      '<div class="form-actions"><button type="button" class="btn btn-md btn-filled ring-focus" data-action="save-roles">Save team</button></div>'
    );
  }

  function renderDetail(){
    var a = getAccount(currentDetailId);
    if (!a) { closeDetail(); return; }
    renderDetailHeader(a);
    var body = $("#detail-body");
    if (activeTab === "overview") body.innerHTML = renderOverviewTab(a);
    else if (activeTab === "scope") body.innerHTML = renderScopeTab(a);
    else if (activeTab === "activity") body.innerHTML = renderActivityTab(a);
    else if (activeTab === "team") body.innerHTML = renderTeamTab(a);
  }

  function renderAll(){
    renderCurrentView();
    if (currentDetailId && !$("#detail-overlay").hidden) renderDetail();
  }

  // ---------------- event wiring (delegated, attached once) ----------------
  document.addEventListener("click", function(e){
    var calPopupEl = $("#calendar-popup");
    if (calPopupEl && !calPopupEl.hidden && !e.target.closest("#calendar-popup") && !e.target.closest(".week-jump-trigger")) {
      closeCalendarPopup();
    }

    var weekTriggerBtn = e.target.closest && e.target.closest(".week-jump-trigger");
    if (weekTriggerBtn) {
      if (weekTriggerBtn.id === "accounts-week-jump-btn") { openCalendarPopup("accounts", weekTriggerBtn, weeklyWeekKey || currentWeekKey()); return; }
      if (weekTriggerBtn.id === "weekly-jump-btn") { openCalendarPopup("weekly", weekTriggerBtn, weeklyWeekKey || currentWeekKey()); return; }
      if (weekTriggerBtn.id === "week-jump-btn") { openCalendarPopup("detail", weekTriggerBtn, selectedWeekKey || currentWeekKey()); return; }
    }

    var calDayBtn = e.target.closest && e.target.closest("[data-cal-date]");
    if (calDayBtn) { pickCalendarDay(calDayBtn.getAttribute("data-cal-date")); return; }

    var calPrevBtn = e.target.closest && e.target.closest('[data-action="cal-prev-month"]');
    if (calPrevBtn) { calendarPopupMonth.setMonth(calendarPopupMonth.getMonth() - 1); renderCalendarPopup(); return; }

    var calNextBtn = e.target.closest && e.target.closest('[data-action="cal-next-month"]');
    if (calNextBtn) { calendarPopupMonth.setMonth(calendarPopupMonth.getMonth() + 1); renderCalendarPopup(); return; }

    var calThisWeekBtn = e.target.closest && e.target.closest('[data-action="cal-this-week"]');
    if (calThisWeekBtn) {
      var cur = currentWeekKey();
      var curEnd = new Date(cur + "T00:00:00");
      curEnd.setDate(curEnd.getDate() + 6);
      applyCalendarRange(cur, isoFromDate(curEnd));
      return;
    }

    var calApplyBtn = e.target.closest && e.target.closest('[data-action="cal-apply"]');
    if (calApplyBtn) {
      if (!calendarRangeFrom) return;
      applyCalendarRange(calendarRangeFrom, calendarRangeTo || calendarRangeFrom);
      return;
    }

    var navBtn = e.target.closest && e.target.closest("[data-nav]");
    if (navBtn) { navigateTo(navBtn.getAttribute("data-nav")); return; }

    var toggleRailBtn = e.target.closest && e.target.closest("#btn-toggle-rail");
    if (toggleRailBtn) {
      railCollapsed = !railCollapsed;
      try { localStorage.setItem("geo-tracker-rail-collapsed", railCollapsed ? "1" : "0"); } catch (e2) {}
      applyRailCollapsed();
      return;
    }

    var addBtn = e.target.closest && e.target.closest("#btn-add-account");
    if (addBtn) { openAddModal(null); return; }

    var addProjBtn = e.target.closest && e.target.closest('[data-action="add-project"]');
    if (addProjBtn) { openAddModal(currentClientId); return; }

    var clientCard = e.target.closest && e.target.closest("[data-client-id]");
    if (clientCard) { currentClientId = clientCard.getAttribute("data-client-id"); renderGrid(); window.scrollTo(0, 0); return; }

    var backBtn = e.target.closest && e.target.closest('[data-action="client-back"]');
    if (backBtn) { currentClientId = null; renderGrid(); return; }

    var closeAdd = e.target.closest && e.target.closest('[data-action="close-add"]');
    if (closeAdd) { $("#add-overlay").hidden = true; return; }

    var card = e.target.closest && e.target.closest("[data-open-id]");
    if (card) { openDetail(card.getAttribute("data-open-id")); return; }

    var ragChip = e.target.closest && e.target.closest("[data-rag-filter]");
    if (ragChip) { filterRag = ragChip.getAttribute("data-rag-filter"); renderAll(); return; }

    var closeDetailBtn = e.target.closest && e.target.closest('[data-action="close-detail"]');
    if (closeDetailBtn) { closeDetail(); return; }

    var tabBtn = e.target.closest && e.target.closest("[data-tab]");
    if (tabBtn) { activeTab = tabBtn.getAttribute("data-tab"); if (activeTab !== "team") draftRoles = null; renderDetail(); return; }

    var deleteAcctBtn = e.target.closest && e.target.closest('[data-action="delete-account"]');
    if (deleteAcctBtn) {
      var a = getAccount(currentDetailId);
      if (a && confirm('Delete ' + (a.projectCount > 1 ? 'project "' + a.projectName + '" of ' + a.clientName : 'account "' + a.clientName + '" and its only project') + ' permanently? This cannot be undone.')) {
        deleteAccount(currentDetailId);
        closeDetail();
      }
      return;
    }

    var toggleScope = e.target.closest && e.target.closest('[data-action="toggle-scope-edit"]');
    if (toggleScope) { scopeEditing = true; renderDetail(); return; }

    var cancelScope = e.target.closest && e.target.closest('[data-action="cancel-scope-edit"]');
    if (cancelScope) { scopeEditing = false; renderDetail(); return; }

    var saveScope = e.target.closest && e.target.closest('[data-action="save-scope"]');
    if (saveScope) {
      var val = $("#scope-textarea").value;
      scopeEditing = false;
      updateAccount(currentDetailId, {scopeText: val}).then(renderDetail);
      return;
    }

    var weekKeyBtn = e.target.closest && e.target.closest("[data-week-key]");
    if (weekKeyBtn) { selectedWeekKey = weekKeyBtn.getAttribute("data-week-key"); renderDetail(); return; }

    var weeklyKeyBtn = e.target.closest && e.target.closest("[data-weekly-week-key]");
    if (weeklyKeyBtn) { weeklyWeekKey = weeklyKeyBtn.getAttribute("data-weekly-week-key"); renderWeeklyView(); return; }

    var weekSubtabBtn = e.target.closest && e.target.closest("[data-week-subtab]");
    if (weekSubtabBtn) { weekSubTab = weekSubtabBtn.getAttribute("data-week-subtab"); renderDetail(); return; }

    var addRoleBtn = e.target.closest && e.target.closest('[data-action="add-role"]');
    if (addRoleBtn) { draftRoles.push({role:"", value:""}); renderDetail(); return; }

    var removeRoleBtn = e.target.closest && e.target.closest('[data-action="remove-role"]');
    if (removeRoleBtn) {
      var ri = Number(removeRoleBtn.getAttribute("data-role-index"));
      draftRoles.splice(ri, 1);
      renderDetail();
      return;
    }

    var saveRolesBtn = e.target.closest && e.target.closest('[data-action="save-roles"]');
    if (saveRolesBtn) {
      var cleanRoles = draftRoles.filter(function(r){ return r.role.trim() || r.value.trim(); });
      updateAccount(currentDetailId, {roles: cleanRoles}).then(function(){ draftRoles = null; renderDetail(); });
      return;
    }
  });

  document.addEventListener("input", function(e){
    if (e.target.matches && e.target.matches("[data-role-field]")) {
      var idx = Number(e.target.getAttribute("data-role-index"));
      var field = e.target.getAttribute("data-role-field");
      if (draftRoles && draftRoles[idx]) draftRoles[idx][field] = e.target.value;
      return;
    }
    if (e.target.id === "search-input") { searchTerm = e.target.value; renderGrid(); return; }
  });

  document.addEventListener("change", function(e){
    if (e.target.id === "sort-select") { sortMode = e.target.value; renderGrid(); return; }
  });

  document.addEventListener("submit", function(e){
    var form = e.target;
    if (form.matches && form.matches('[data-form="overview"]')) {
      e.preventDefault();
      var fd = new FormData(form);
      var patch = {
        name: fd.get("name").trim(),
        clientName: fd.get("clientName").trim(),
        rag: fd.get("rag"),
        sowStatus: fd.get("sowStatus"),
        projectStatus: fd.get("projectStatus"),
        invoiceStatus: fd.get("invoiceStatus").trim(),
        ownerOnshore: fd.get("ownerOnshore").trim(),
        ownerOffshore: fd.get("ownerOffshore").trim(),
        revenue: Number(fd.get("revenue")) || 0,
        invoicedToDate: Number(fd.get("invoicedToDate")) || 0,
        nextInvoiceDue: fd.get("nextInvoiceDue") || null,
        engagementStartDate: fd.get("engagementStartDate") || null,
        engagementEndDate: fd.get("engagementEndDate") || null,
        logoSvg: fd.get("logoSvg").trim(),
        logoImg: fd.get("logoImg").trim(),
        notes: fd.get("notes").trim()
      };
      updateAccount(currentDetailId, patch).then(renderDetail);
      return;
    }
    if (form.matches && form.matches('[data-form="week"]')) {
      e.preventDefault();
      var fd2 = new FormData(form);
      var acc = getAccount(currentDetailId);
      if (!acc) return;
      var wk = fd2.get("weekKey");
      var newWeek = {
        completed: fd2.get("completed").trim(),
        inProgress: fd2.get("inProgress").trim(),
        nextSteps: fd2.get("nextSteps").trim(),
        risk: fd2.get("risk").trim(),
        mitigationActions: fd2.get("mitigationActions").trim(),
        mitigationDeadline: fd2.get("mitigationDeadline") || null,
        scopeCreep: fd2.get("scopeCreep").trim()
      };
      var newWeeks = Object.assign({}, acc.weeks || {});
      newWeeks[wk] = newWeek;
      updateAccount(currentDetailId, {weeks: newWeeks}).then(renderDetail);
      return;
    }
    if (form.matches && form.matches('[data-form="weekly-week"]')) {
      e.preventDefault();
      var fd4 = new FormData(form);
      var wAccId = form.getAttribute("data-account-id");
      var wAcc = getAccount(wAccId);
      if (!wAcc) return;
      var wWk = fd4.get("weekKey");
      var wNewWeek = {
        completed: fd4.get("completed").trim(),
        inProgress: fd4.get("inProgress").trim(),
        nextSteps: fd4.get("nextSteps").trim(),
        risk: fd4.get("risk").trim(),
        mitigationActions: fd4.get("mitigationActions").trim(),
        mitigationDeadline: fd4.get("mitigationDeadline") || null,
        scopeCreep: fd4.get("scopeCreep").trim()
      };
      var wNewWeeks = Object.assign({}, wAcc.weeks || {});
      wNewWeeks[wWk] = wNewWeek;
      updateAccount(wAccId, {weeks: wNewWeeks}).then(renderWeeklyView);
      return;
    }
    if (form.id === "add-form") {
      e.preventDefault();
      var fd3 = new FormData(form);
      var name = (fd3.get("name") || "").trim();
      var projectName = (fd3.get("projectName") || "").trim() || "GEO Engagement";
      if (!addContextClientId && !name) return;
      var fields = {
        name: projectName,
        rag: fd3.get("rag"),
        sowStatus: fd3.get("sowStatus"),
        projectStatus: fd3.get("projectStatus"),
        invoiceStatus: fd3.get("invoiceStatus").trim() || "Not Scheduled",
        ownerOnshore: fd3.get("ownerOnshore").trim(),
        ownerOffshore: fd3.get("ownerOffshore").trim(),
        revenue: Number(fd3.get("revenue")) || 0,
        invoicedToDate: Number(fd3.get("invoicedToDate")) || 0,
        scopeText: fd3.get("scopeText").trim()
      };
      var done = addContextClientId
        ? addProject(addContextClientId, fields)
        : createAccount({clientName: name, project: fields});
      done.then(function(id){
        form.reset();
        $("#add-overlay").hidden = true;
        populateAddFormSelects();
        if (id) openDetail(id);
      });
      return;
    }
  });

  function openAddModal(clientId){
    addContextClientId = clientId;
    var c = clientId ? clients.find(function(x){ return x.id === clientId; }) : null;
    $("#add-modal-title").textContent = c ? "Add project to " + c.name : "New account";
    var nameField = $("#add-client-name-field");
    nameField.hidden = !!c;
    nameField.querySelector("input").required = !c;
    $('#add-form input[name="projectName"]').value = "GEO Engagement";
    $("#add-overlay").hidden = false;
  }

  // ---------------- boot ----------------
  function populateAddFormSelects(){
    var sowSel = $('#add-form select[name="sowStatus"]');
    var projSel = $('#add-form select[name="projectStatus"]');
    sowSel.innerHTML = SOW_STATUS_OPTIONS.map(function(v){ return '<option value="' + esc(v) + '"' + (v==="N/A"?" selected":"") + '>' + esc(v) + '</option>'; }).join("");
    projSel.innerHTML = PROJECT_STATUS_OPTIONS.map(function(v){ return '<option value="' + esc(v) + '"' + (v==="Yet to Start"?" selected":"") + '>' + esc(v) + '</option>'; }).join("");
  }

  async function init(){
    populateAddFormSelects();
    try {
      var savedView = localStorage.getItem("geo-tracker-view");
      if (savedView && VIEW_META[savedView]) currentView = savedView;
      railCollapsed = localStorage.getItem("geo-tracker-rail-collapsed") === "1";
    } catch (e) {}
    renderNavList();
    applyRailCollapsed();
    navigateTo(currentView);
    await loadAccounts();
  }

  init();
})();
</script>
</body>
</html>
