  // ---- accent colour taken from each client's logo ----
  var accentCache = {};

  function rgbToHsl(r, g, b){
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2, h = 0, sat = 0;
    if (max !== min) {
      var d = max - min;
      sat = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h /= 6;
    }
    return {h: h, s: sat, l: l};
  }

  // votes: {"r,g,b": weight}. Prefer the most frequent clearly-coloured value.
  function pickAccent(votes){
    var best = null, bestScore = 0, fallback = null, fallbackScore = 0;
    Object.keys(votes).forEach(function(k){
      var p = k.split(",").map(Number), hsl = rgbToHsl(p[0], p[1], p[2]), w = votes[k];
      if (hsl.l > 0.88) return;
      if (hsl.s >= 0.3 && hsl.l >= 0.12) { if (w > bestScore) { best = p; bestScore = w; } }
      else if (w > fallbackScore) { fallback = p; fallbackScore = w; }
    });
    var c = best || fallback;
    return c ? "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")" : null;
  }

  function accentFromSvg(svg){
    var votes = {};
    var re = /(?:fill|stroke|stop-color)\s*[=:]\s*["']?\s*(#[0-9a-fA-F]{3,6}|rgb\([^)]*\))/g, m;
    while ((m = re.exec(svg))) {
      var v = m[1], r, g, b;
      if (v.charAt(0) === "#") {
        if (v.length === 4) v = "#" + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
        if (v.length !== 7) continue;
        r = parseInt(v.slice(1, 3), 16); g = parseInt(v.slice(3, 5), 16); b = parseInt(v.slice(5, 7), 16);
      } else {
        var n = v.match(/\d+/g);
        if (!n || n.length < 3) continue;
        r = +n[0]; g = +n[1]; b = +n[2];
      }
      var key = r + "," + g + "," + b;
      votes[key] = (votes[key] || 0) + 1;
    }
    return pickAccent(votes);
  }

  function accentFromImage(src){
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){
        try {
          var w = 48, h = Math.max(1, Math.round(48 * img.naturalHeight / img.naturalWidth));
          var cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          var ctx = cv.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          var data = ctx.getImageData(0, 0, w, h).data, votes = {};
          for (var i = 0; i < data.length; i += 4) {
            if (data[i + 3] < 128) continue;
            var key = (data[i] >> 4 << 4) + "," + (data[i + 1] >> 4 << 4) + "," + (data[i + 2] >> 4 << 4);
            votes[key] = (votes[key] || 0) + 1;
          }
          resolve(pickAccent(votes));
        } catch (e) { resolve(null); }
      };
      img.onerror = function(){ resolve(null); };
      img.src = src;
    });
  }

  function accentFor(c){
    if (!accentCache[c.id]) {
      if (c.logoSvg) accentCache[c.id] = Promise.resolve(accentFromSvg(c.logoSvg));
      else if (c.logoImg) accentCache[c.id] = accentFromImage(c.logoImg);
      else accentCache[c.id] = Promise.resolve(null);
    }
    return accentCache[c.id];
  }

    );
  }

  function renderChangesTab(a){
    var wk = currentWeekKey();
    var rw = resolvedWeek(a, wk);
    return (
      '<form data-form="week" class="week-fields">' +
        '<input type="hidden" name="weekKey" value="' + esc(wk) + '">' +
        carryNoteHtml(rw, "changes") +
        '<label class="field">' + fieldLabel("Scope creep") + '<div class="field-wrap"><textarea name="scopeCreep" rows="5" placeholder="Any work happening outside the agreed SOW&hellip;">' + esc(rw.scopeCreep || "") + '</textarea></div></label>' +
        '<label class="field">' + fieldLabel("Change requests") + '<div class="field-wrap"><textarea name="changeRequests" rows="5" placeholder="Change requests raised, their status and impact&hellip;">' + esc(rw.changeRequests || "") + '</textarea></div></label>' +
        '<div class="form-actions"><button type="submit" class="btn btn-md btn-filled ring-focus">Save scope &amp; changes</button></div>' +
      '</form>'
    );
  }

  function renderInvoicesTab(a){
    if (!draftInvoices) draftInvoices = a.invoices.map(function(i){ return Object.assign({}, i); });
    var raised = draftInvoices.reduce(function(sum, i){ return sum + (Number(i.amount) || 0); }, 0);
    var revenue = Number(a.revenue) || 0;
    var pct = revenue ? Math.round((raised / revenue) * 100) : 0;
    var rows = draftInvoices.map(function(i, idx){
      return '<tr>' +
        '<td><div class="field-wrap"><input data-invoice-field="number" data-invoice-index="' + idx + '" value="' + esc(i.number) + '" placeholder="Invoice no."></div></td>' +
        '<td><div class="field-wrap"><input type="date" data-invoice-field="date" data-invoice-index="' + idx + '" value="' + esc(i.date) + '"></div></td>' +
        '<td class="pct-cell"><div class="field-wrap"><input type="number" min="0" step="1" data-invoice-field="amount" data-invoice-index="' + idx + '" value="' + esc(i.amount || "") + '" placeholder="Amount"></div></td>' +
        '<td><button type="button" class="btn btn-icon btn-sm btn-text ring-focus" data-action="remove-invoice" data-invoice-index="' + idx + '" aria-label="Remove invoice" title="Remove invoice">' + ICON_CLOSE + '</button></td>' +
      '</tr>';
    }).join("");
    return (
      '<div class="carry-note">' + (draftInvoices.length
        ? 'Raised <b>' + money(raised) + '</b> of ' + money(revenue) + ' total revenue (' + pct + '%) &middot; outstanding ' + money(Math.max(revenue - raised, 0)) + '. This is the invoiced and recognized revenue shown across the tracker.'
        : 'No invoices raised yet. Add each invoice as it is raised &mdash; invoiced and recognized revenue are calculated from this list.') + '</div>' +
      (draftInvoices.length ? '<table class="roles-table invoices-table"><thead><tr><th>Invoice no.</th><th>Date</th><th>Amount (USD)</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' : '') +
      '<button type="button" class="btn btn-sm btn-outlined ring-focus" data-action="add-invoice">' + ICON_ADD + ' Add invoice</button>' +
      '<div class="form-actions"><button type="button" class="btn btn-md btn-filled ring-focus" data-action="save-invoices">Save invoices</button></div>'
    );
  }

  function renderTeamTab(a){
    if (!draftRoles) draftRoles = (a.roles && a.roles.length ? a.roles : DEFAULT_ROLES.map(function(r){ return {role: r, name: "", pct: ""}; })).map(function(r){ return Object.assign({}, r); });
    var rows = draftRoles.map(function(r, i){
      return (
        '<tr data-role-index="' + i + '">' +
          '<td><div class="field-wrap"><input data-role-field="role" data-role-index="' + i + '" value="' + esc(r.role) + '" placeholder="Role"></div></td>' +
          '<td><div class="field-wrap"><input data-role-field="name" data-role-index="' + i + '" value="' + esc(r.name) + '" placeholder="Name"></div></td>' +
          '<td class="pct-cell"><div class="field-wrap"><input type="number" min="0" max="100" step="5" data-role-field="pct" data-role-index="' + i + '" value="' + esc(r.pct) + '" placeholder="%"></div></td>' +
          '<td>' +
            '<button type="button" class="btn btn-icon btn-sm btn-text ring-focus" data-action="add-role-person" data-role-index="' + i + '" aria-label="Add another person to this role" title="Add another person to this role">' + ICON_ADD + '</button>' +
            '<button type="button" class="btn btn-icon btn-sm btn-text ring-focus" data-action="remove-role" data-role-index="' + i + '" aria-label="Remove row" title="Remove row">' + ICON_CLOSE + '</button>' +
          '</td>' +
        '</tr>'
      );
    }).join("");
    return (
      '<table class="roles-table"><thead><tr><th>Role</th><th>Name</th><th>Allocation %</th><th></th></tr></thead><tbody id="roles-body">' + rows + '</tbody></table>' +
      '<button type="button" class="btn btn-sm btn-outlined ring-focus" data-action="add-role">' + ICON_ADD + ' Add role</button>' +
      '<div class="form-actions"><button type="button" class="btn btn-md btn-filled ring-focus" data-action="save-roles">Save team</button></div>'
    );
  }

  function renderDetail(){
    var a = getAccount(currentDetailId);
    if (!a) { closeDetail(); return; }
    renderDetailHeader(a);
    var body = $("#detail-body");
    if (activeTab === "overview") body.innerHTML = renderOverviewTab(a);
    else if (activeTab === "scope") body.innerHTML = renderScopeTab(a);
    else if (activeTab === "status") body.innerHTML = renderStatusTab(a);
    else if (activeTab === "risks") body.innerHTML = renderRisksTab(a);
    else if (activeTab === "changes") body.innerHTML = renderChangesTab(a);
    else if (activeTab === "invoices") body.innerHTML = renderInvoicesTab(a);
    else if (activeTab === "team") body.innerHTML = renderTeamTab(a);
  }

  function renderAll(){
    renderCurrentView();
    if (currentDetailId && !$("#detail-overlay").hidden) renderDetail();
  }

  // ---------------- event wiring (delegated, attached once) ----------------
  document.addEventListener("click", function(e){
    var calPopupEl = $("#calendar-popup");
    if (calPopupEl && !calPopupEl.hidden && !e.target.closest("#calendar-popup") && !e.target.closest(".week-jump-trigger")) {
      closeCalendarPopup();
    }

    var weekTriggerBtn = e.target.closest && e.target.closest(".week-jump-trigger");
    if (weekTriggerBtn) {
      if (weekTriggerBtn.id === "accounts-week-jump-btn") { openCalendarPopup("accounts", weekTriggerBtn, weeklyWeekKey || currentWeekKey()); return; }
      if (weekTriggerBtn.id === "weekly-jump-btn") { openCalendarPopup("weekly", weekTriggerBtn, weeklyWeekKey || currentWeekKey()); return; }
      if (weekTriggerBtn.id === "week-jump-btn") { openCalendarPopup("detail", weekTriggerBtn, selectedWeekKey || currentWeekKey()); return; }
    }

    var calDayBtn = e.target.closest && e.target.closest("[data-cal-date]");
    if (calDayBtn) { pickCalendarDay(calDayBtn.getAttribute("data-cal-date")); return; }

    var calPrevBtn = e.target.closest && e.target.closest('[data-action="cal-prev-month"]');
    if (calPrevBtn) { calendarPopupMonth.setMonth(calendarPopupMonth.getMonth() - 1); renderCalendarPopup(); return; }

    var calNextBtn = e.target.closest && e.target.closest('[data-action="cal-next-month"]');
    if (calNextBtn) { calendarPopupMonth.setMonth(calendarPopupMonth.getMonth() + 1); renderCalendarPopup(); return; }

    var calThisWeekBtn = e.target.closest && e.target.closest('[data-action="cal-this-week"]');
    if (calThisWeekBtn) {
      var cur = currentWeekKey();
      var curEnd = new Date(cur + "T00:00:00");
      curEnd.setDate(curEnd.getDate() + 6);
      applyCalendarRange(cur, isoFromDate(curEnd));
      return;
    }

    var calApplyBtn = e.target.closest && e.target.closest('[data-action="cal-apply"]');
    if (calApplyBtn) {
      if (!calendarRangeFrom) return;
      applyCalendarRange(calendarRangeFrom, calendarRangeTo || calendarRangeFrom);
      return;
    }

    var navBtn = e.target.closest && e.target.closest("[data-nav]");
    if (navBtn) { navigateTo(navBtn.getAttribute("data-nav")); return; }

    var toggleRailBtn = e.target.closest && e.target.closest("#btn-toggle-rail");
    if (toggleRailBtn) {
      railCollapsed = !railCollapsed;
      try { localStorage.setItem("geo-tracker-rail-collapsed", railCollapsed ? "1" : "0"); } catch (e2) {}
      applyRailCollapsed();
      return;
    }

    var addBtn = e.target.closest && e.target.closest("#btn-add-account");
    if (addBtn) { openAddModal(null); return; }

    var importBtn = e.target.closest && e.target.closest("#btn-import-excel");
    if (importBtn) { openImportModal(); return; }

    var closeImport = e.target.closest && e.target.closest('[data-action="close-import"]');
    if (closeImport) { closeImportModal(); return; }

    var importParseBtn = e.target.closest && e.target.closest("#import-parse-btn");
    if (importParseBtn) {
      try {
        var sheetName = $("#import-sheet-select").value;
        importState.parsed = parseImportSheet(importState.wb, sheetName);
        renderImportPreview();
        $("#import-step-pick").hidden = true;
        $("#import-step-preview").hidden = false;
      } catch (err) {
        $("#import-pick-status").textContent = err.message;
      }
      return;
    }

    var importBackBtn = e.target.closest && e.target.closest('[data-action="import-back"]');
    if (importBackBtn) { $("#import-step-preview").hidden = true; $("#import-step-pick").hidden = false; return; }

    var importApplyBtn = e.target.closest && e.target.closest("#import-apply-btn");
    if (importApplyBtn) { applyImport(); return; }

    var addProjBtn = e.target.closest && e.target.closest('[data-action="add-project"]');
    if (addProjBtn) { openAddModal(currentClientId); return; }

    var clientCard = e.target.closest && e.target.closest("[data-client-id]");
    if (clientCard) { currentClientId = clientCard.getAttribute("data-client-id"); renderGrid(); window.scrollTo(0, 0); return; }

    var backBtn = e.target.closest && e.target.closest('[data-action="client-back"]');
    if (backBtn) { currentClientId = null; renderGrid(); return; }

    var closeAdd = e.target.closest && e.target.closest('[data-action="close-add"]');
    if (closeAdd) { $("#add-overlay").hidden = true; return; }

    var pdfBtn = e.target.closest && e.target.closest('[data-action="download-weekly-pdf"]');
    if (pdfBtn) { downloadWeeklyPdf(); return; }

    var card = e.target.closest && e.target.closest("[data-open-id]");
    if (card) {
      openDetail(card.getAttribute("data-open-id"));
      var openWeek = card.getAttribute("data-open-week");
      if (openWeek) { selectedWeekKey = openWeek; renderDetail(); }
      return;
    }

    var ragChip = e.target.closest && e.target.closest("[data-rag-filter]");
    if (ragChip) { filterRag = ragChip.getAttribute("data-rag-filter"); renderAll(); return; }

    var closeDetailBtn = e.target.closest && e.target.closest('[data-action="close-detail"]');
    if (closeDetailBtn) { closeDetail(); return; }

    var tabBtn = e.target.closest && e.target.closest("[data-tab]");
    if (tabBtn) { activeTab = tabBtn.getAttribute("data-tab"); if (activeTab !== "team") draftRoles = null; if (activeTab !== "invoices") draftInvoices = null; renderDetail(); return; }

    var deleteAcctBtn = e.target.closest && e.target.closest('[data-action="delete-account"]');
    if (deleteAcctBtn) {
      var a = getAccount(currentDetailId);
      if (a && confirm('Delete ' + (a.projectCount > 1 ? 'project "' + a.projectName + '" of ' + a.clientName : 'account "' + a.clientName + '" and its only project') + ' permanently? This cannot be undone.')) {
        deleteAccount(currentDetailId);
        closeDetail();
      }
      return;
    }

    var toggleScope = e.target.closest && e.target.closest('[data-action="toggle-scope-edit"]');
    if (toggleScope) { scopeEditing = true; renderDetail(); return; }

    var cancelScope = e.target.closest && e.target.closest('[data-action="cancel-scope-edit"]');
    if (cancelScope) { scopeEditing = false; renderDetail(); return; }

    var saveScope = e.target.closest && e.target.closest('[data-action="save-scope"]');
    if (saveScope) {
      var val = $("#scope-textarea").value;
      scopeEditing = false;
      updateAccount(currentDetailId, {scopeText: val}).then(renderDetail);
      return;
    }

    var weekKeyBtn = e.target.closest && e.target.closest("[data-week-key]");
    if (weekKeyBtn) { selectedWeekKey = weekKeyBtn.getAttribute("data-week-key"); renderDetail(); return; }

    var weeklyKeyBtn = e.target.closest && e.target.closest("[data-weekly-week-key]");
    if (weeklyKeyBtn) { weeklyWeekKey = weeklyKeyBtn.getAttribute("data-weekly-week-key"); renderWeeklyView(); return; }

    var weekSubtabBtn = e.target.closest && e.target.closest("[data-week-subtab]");
    if (weekSubtabBtn) { weekSubTab = weekSubtabBtn.getAttribute("data-week-subtab"); renderDetail(); return; }

    var addInvoiceBtn = e.target.closest && e.target.closest('[data-action="add-invoice"]');
    if (addInvoiceBtn) {
      draftInvoices.push({id: "inv-" + Date.now().toString(36), number: "INV-" + (draftInvoices.length + 1), date: todayIso(), amount: ""});
      renderDetail();
      return;
    }

    var removeInvoiceBtn = e.target.closest && e.target.closest('[data-action="remove-invoice"]');
    if (removeInvoiceBtn) { draftInvoices.splice(Number(removeInvoiceBtn.getAttribute("data-invoice-index")), 1); renderDetail(); return; }

    var saveInvoicesBtn = e.target.closest && e.target.closest('[data-action="save-invoices"]');
    if (saveInvoicesBtn) {
      var cleanInvoices = draftInvoices.filter(function(i){ return Number(i.amount) > 0; }).map(function(i){
        return {id: i.id, number: String(i.number || "").trim(), date: i.date || "", amount: Number(i.amount)};
      });
      var total = cleanInvoices.reduce(function(sum, i){ return sum + i.amount; }, 0);
      var acct = getAccount(currentDetailId);
      var patchInv = {invoices: cleanInvoices};
      if (!cleanInvoices.length) patchInv.invoicedToDate = 0;
      updateAccount(currentDetailId, patchInv).then(function(){
        draftInvoices = null;
        if (acct && Number(acct.revenue) > 0 && total > Number(acct.revenue)) showToast("Invoices raised exceed total revenue", "error");
        renderDetail();
      });
      return;
    }

    var addRoleBtn = e.target.closest && e.target.closest('[data-action="add-role"]');
    if (addRoleBtn) { draftRoles.push({role:"", name:"", pct:""}); renderDetail(); return; }

    var addPersonBtn = e.target.closest && e.target.closest('[data-action="add-role-person"]');
    if (addPersonBtn) {
      var pi = Number(addPersonBtn.getAttribute("data-role-index"));
      draftRoles.splice(pi + 1, 0, {role: draftRoles[pi].role, name: "", pct: ""});
      renderDetail();
      return;
    }

    var removeRoleBtn = e.target.closest && e.target.closest('[data-action="remove-role"]');
    if (removeRoleBtn) {
      var ri = Number(removeRoleBtn.getAttribute("data-role-index"));
      draftRoles.splice(ri, 1);
      renderDetail();
      return;
    }

    var saveRolesBtn = e.target.closest && e.target.closest('[data-action="save-roles"]');
    if (saveRolesBtn) {
      var cleanRoles = draftRoles.filter(function(r){ return String(r.role).trim() || String(r.name).trim(); }).map(function(r){
        var n = r.pct === "" || r.pct === null || r.pct === undefined ? null : Number(r.pct);
        return {role: String(r.role).trim(), name: String(r.name).trim(), pct: (n === null || isNaN(n)) ? null : n};
      });
      updateAccount(currentDetailId, {roles: cleanRoles}).then(function(){ draftRoles = null; renderDetail(); });
      return;
    }
  });

  document.addEventListener("input", function(e){
    if (e.target.matches && e.target.matches("[data-invoice-field]")) {
      var ii = Number(e.target.getAttribute("data-invoice-index"));
      if (draftInvoices && draftInvoices[ii]) draftInvoices[ii][e.target.getAttribute("data-invoice-field")] = e.target.value;
      return;
    }
    if (e.target.matches && e.target.matches("[data-role-field]")) {
      var idx = Number(e.target.getAttribute("data-role-index"));
      var field = e.target.getAttribute("data-role-field");
      if (draftRoles && draftRoles[idx]) draftRoles[idx][field] = e.target.value;
      return;
    }
    if (e.target.id === "search-input") { searchTerm = e.target.value; renderGrid(); return; }
  });

  document.addEventListener("change", function(e){
    if (e.target.id === "sort-select") { sortMode = e.target.value; renderGrid(); return; }
    if (e.target.matches && e.target.matches("[data-invoice-mode]")) {
      var sel = document.getElementById("invoice-status-select");
      var helper = document.getElementById("invoice-status-helper");
      var manualOn = e.target.value === "manual";
      var a = getAccount(currentDetailId);
      sel.disabled = !manualOn;
      if (a) sel.value = manualOn ? a.invoiceStatusManual : effectiveInvoiceStatus(Object.assign({}, a, {invoiceStatus: a.invoiceStatusManual, invoiceMode: "auto"}));
      helper.textContent = manualOn ? "Set by you. It will not change when the invoice date changes." : "Calculated from the invoice date and amounts. Switch to Manual to override.";
      return;
    }
    if (e.target.matches && e.target.matches("[data-period-select]")) {
      if (e.target.getAttribute("data-period-select") === "weekly") { weeklyWeekKey = e.target.value; renderWeeklyView(); refreshHeaderSub(); }
      else { selectedWeekKey = e.target.value; renderDetail(); }
      return;
    }
    if (e.target.id === "import-file-input") {
      var f = e.target.files && e.target.files[0];
      if (f) handleImportFile(f);
      return;
    }
  });

  document.addEventListener("submit", function(e){
    var form = e.target;
    if (form.matches && form.matches('[data-form="overview"]')) {
      e.preventDefault();
      var fd = new FormData(form);
      var patch = {
        name: fd.get("name").trim(),
        clientName: fd.get("clientName").trim(),
        rag: fd.get("rag"),
        sowStatus: fd.get("sowStatus"),
        projectStatus: fd.get("projectStatus"),
        invoiceMode: fd.get("invoiceMode") === "manual" ? "manual" : "auto",
        ownerOnshore: fd.get("ownerOnshore").trim(),
        ownerOffshore: fd.get("ownerOffshore").trim(),
        revenue: Number(fd.get("revenue")) || 0,
        nextInvoiceDue: fd.get("nextInvoiceDue") || null,
        engagementStartDate: fd.get("engagementStartDate") || null,
        engagementEndDate: fd.get("engagementEndDate") || null,
        logoSvg: fd.get("logoSvg").trim(),
        logoImg: fd.get("logoImg").trim(),
        notes: fd.get("notes").trim()
      };
      if (patch.invoiceMode === "manual" && fd.get("invoiceStatus")) patch.invoiceStatus = fd.get("invoiceStatus");
      if (fd.has("invoicedToDate")) patch.invoicedToDate = Number(fd.get("invoicedToDate")) || 0;
      updateAccount(currentDetailId, patch).then(renderDetail);
      return;
    }
    if (form.matches && form.matches('[data-form="week"]')) {
      e.preventDefault();
      var fd2 = new FormData(form);
      var acc = getAccount(currentDetailId);
      if (!acc) return;
      var wk = fd2.get("weekKey");
      var newWeek = Object.assign({}, weekData(acc, wk));
      ["completed", "inProgress", "nextSteps", "risk", "mitigationActions", "scopeCreep", "changeRequests"].forEach(function(f){
        if (fd2.has(f)) newWeek[f] = String(fd2.get(f)).trim();
      });
      if (fd2.has("mitigationDeadline")) newWeek.mitigationDeadline = fd2.get("mitigationDeadline") || null;
      if (fd2.has("risk")) newWeek.riskSaved = true;
      if (fd2.has("scopeCreep")) newWeek.changesSaved = true;
      var newWeeks = Object.assign({}, acc.weeks || {});
      newWeeks[wk] = newWeek;
      updateAccount(currentDetailId, {weeks: newWeeks}).then(renderDetail);
      return;
    }
    if (form.matches && form.matches('[data-form="weekly-week"]')) {
      e.preventDefault();
      var fd4 = new FormData(form);
      var wAccId = form.getAttribute("data-account-id");
      var wAcc = getAccount(wAccId);
      if (!wAcc) return;
      var wWk = fd4.get("weekKey");
      var wNewWeek = Object.assign({}, weekData(wAcc, wWk), {
        completed: fd4.get("completed").trim(),
        inProgress: fd4.get("inProgress").trim(),
        nextSteps: fd4.get("nextSteps").trim(),
        risk: fd4.get("risk").trim(),
        mitigationActions: fd4.get("mitigationActions").trim(),
        mitigationDeadline: fd4.get("mitigationDeadline") || null,
        scopeCreep: fd4.get("scopeCreep").trim()
      });
      var wNewWeeks = Object.assign({}, wAcc.weeks || {});
      wNewWeeks[wWk] = wNewWeek;
      updateAccount(wAccId, {weeks: wNewWeeks}).then(renderWeeklyView);
      return;
    }
    if (form.id === "add-form") {
      e.preventDefault();
      var fd3 = new FormData(form);
      var name = (fd3.get("name") || "").trim();
      var projectName = (fd3.get("projectName") || "").trim() || "GEO Engagement";
      if (!addContextClientId && !name) return;
      var fields = {
        name: projectName,
        rag: fd3.get("rag"),
        sowStatus: fd3.get("sowStatus"),
        projectStatus: fd3.get("projectStatus"),
        ownerOnshore: fd3.get("ownerOnshore").trim(),
        ownerOffshore: fd3.get("ownerOffshore").trim(),
        revenue: Number(fd3.get("revenue")) || 0,
        invoicedToDate: Number(fd3.get("invoicedToDate")) || 0,
        scopeText: fd3.get("scopeText").trim()
      };
      var done = addContextClientId
        ? addProject(addContextClientId, fields)
        : createAccount({clientName: name, project: fields});
      done.then(function(id){
        form.reset();
        $("#add-overlay").hidden = true;
        populateAddFormSelects();
        if (id) openDetail(id);
      });
      return;
    }
  });

  function openAddModal(clientId){
    addContextClientId = clientId;
    var c = clientId ? clients.find(function(x){ return x.id === clientId; }) : null;
    $("#add-modal-title").textContent = c ? "Add project to " + c.name : "New account";
    var nameField = $("#add-client-name-field");
    nameField.hidden = !!c;
    nameField.querySelector("input").required = !c;
    $('#add-form input[name="projectName"]').value = "GEO Engagement";
    $("#add-overlay").hidden = false;
  }

  // ---------------- boot ----------------
  function populateAddFormSelects(){
    var sowSel = $('#add-form select[name="sowStatus"]');
    var projSel = $('#add-form select[name="projectStatus"]');
    sowSel.innerHTML = SOW_STATUS_OPTIONS.map(function(v){ return '<option value="' + esc(v) + '"' + (v==="N/A"?" selected":"") + '>' + esc(v) + '</option>'; }).join("");
    projSel.innerHTML = PROJECT_STATUS_OPTIONS.map(function(v){ return '<option value="' + esc(v) + '"' + (v==="Yet to Start"?" selected":"") + '>' + esc(v) + '</option>'; }).join("");
  }

  async function init(){
    populateAddFormSelects();
    try {
      var savedView = localStorage.getItem("geo-tracker-view");
      if (savedView && VIEW_META[savedView]) currentView = savedView;
      railCollapsed = localStorage.getItem("geo-tracker-rail-collapsed") === "1";
    } catch (e) {}
    renderNavList();
    applyRailCollapsed();
    navigateTo(currentView);
    await loadAccounts();
  }

  init();
})();
</script>
</body>
</html>
