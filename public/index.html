<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>GEO Delivery Tracker</title>

<style>
/* ==========================================================================
   Indegene DS 4.Ai — tokens (subset relevant to this surface)
   Values per INDEGENE-DS-4AI-DESIGN-GUIDELINES.md, Section 4 / 15 / 16.2.
   Font delivery deviates from spec (Google Fonts CDN, not local @font-face)
   for simplicity of a single-file frontend — see the closing note for this trade-off.
   ========================================================================== */
:root{
  /* brand */
  --primary:#5D2CC9;
  --primary-light-background:#F5F0FF;
  --primary-background-hover:#421F8F;
  --primary-background-pressed:#271254;

  /* semantic */
  --success-foreground:#1D5F02;
  --success-light-background:#EAF3E6;
  --error-foreground:#BF1724;
  --error-light-background:#FFE8E8;
  --warning-foreground:#946119;
  --warning-light-background:#FFF4E1;
  --info-foreground:#0E5FB7;
  --info-light-background:#E1EEFB;

  /* neutral ramp */
  --neutral-50:#FAFAFA;
  --neutral-100:#F2F2F2;
  --neutral-200:#E5E5E5;
  --neutral-300:#D1D5DB;
  --neutral-400:#B5B3B3;
  --neutral-500:#9A9A9C;
  --neutral-600:#6D6E71;
  --neutral-700:#4A4647;
  --neutral-800:#332F30;
  --neutral-900:#231F20;
  --neutral-black:var(--neutral-900);
  --neutral-disabled-text:var(--neutral-600);
  --neutral-disabled-graphic:var(--neutral-400);
  --neutral-disabled-background:var(--neutral-300);
  --neutral-light-hover:var(--neutral-100);
  --base-white:#FFFFFF;

  /* surfaces */
  --surface-app-header:#F8F8FC;
  --surface-app-shell-nav:#FBFBFB;
  --surface-page-content:#F7F8FA;

  /* type */
  --font-family:"DM Sans";
  --display-large:  600 57px/64px var(--font-family);
  --display-medium: 600 45px/52px var(--font-family);
  --display-small:  600 36px/44px var(--font-family);
  --headline-large:  600 32px/40px var(--font-family);
  --headline-medium: 600 28px/36px var(--font-family);
  --headline-small:  600 24px/32px var(--font-family);
  --title-large:  500 22px/28px var(--font-family);
  --title-medium: 500 16px/24px var(--font-family);
  --title-small:  500 14px/20px var(--font-family);
  --body-large:  400 16px/24px var(--font-family);
  --body-medium: 400 14px/20px var(--font-family);
  --body-small:  400 12px/16px var(--font-family);
  --label-large:  600 14px/20px var(--font-family);
  --label-medium: 600 12px/16px var(--font-family);
  --label-small:  500 11px/16px var(--font-family);

  /* spacing */
  --spacing-0:0; --spacing-2:2px; --spacing-4:4px; --spacing-6:6px; --spacing-8:8px;
  --spacing-10:10px; --spacing-12:12px; --spacing-16:16px; --spacing-20:20px;
  --spacing-24:24px; --spacing-28:28px; --spacing-32:32px; --spacing-36:36px;
  --spacing-40:40px; --spacing-48:48px; --spacing-52:52px; --spacing-56:56px; --spacing-96:96px;

  /* radius */
  --radius-none:0; --radius-2xs:2px; --radius-xs:4px; --radius-sm:8px;
  --radius-md:16px; --radius-lg:24px; --radius-xl:32px; --radius-full:999px;

  /* elevation */
  --elevation-0:none;
  --elevation-02:0 1px 2px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
  --elevation-04:0 2px 4px rgba(0,0,0,.14), 0 0 2px rgba(0,0,0,.12);
  --elevation-tooltip:0 4px 6px rgba(0,0,0,.25);
  --elevation-toast:0 8px 16px rgba(0,0,0,.25), 0 10px 15px rgba(0,0,0,.10), 0 4px 6px rgba(0,0,0,.10);
  --elevation-modal:0 32px 64px rgba(0,0,0,.24), 0 0 8px rgba(0,0,0,.20);

  --border-1:1px; --border-2:2px; --border-4:4px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font:var(--body-medium); letter-spacing:.25px;
  color:var(--neutral-900);
  background:var(--surface-app-shell-nav);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0;}
button{font-family:var(--font-family);}
.mono{font-variant-numeric:tabular-nums;}
a{color:var(--primary);}

/* focus ring (buttons, chips, cards — anything button-like) */
.ring-focus:focus-visible{
  outline:none;
  box-shadow:0 0 0 2px var(--base-white), 0 0 0 4px var(--primary);
}

/* ---------- shell ---------- */
.shell{display:flex; gap:var(--spacing-8); padding:var(--spacing-12); min-height:100vh;}
.page-content{
  flex:1; min-width:0;
  background:var(--base-white);
  border-radius:var(--radius-md);
  border:1px solid var(--neutral-200);
  padding:var(--spacing-24);
  display:flex; flex-direction:column; gap:var(--spacing-16);
}

/* ---------- app shell nav rail (collapsible) ---------- */
.rail{
  background:var(--surface-app-shell-nav);
  border:1px solid var(--neutral-200);
  border-radius:var(--radius-md);
  display:flex; flex-direction:column;
  padding:var(--spacing-12) var(--spacing-8);
  gap:var(--spacing-4);
  flex-shrink:0;
  position:sticky; top:var(--spacing-12);
  height:calc(100vh - var(--spacing-24));
  transition:width 200ms ease-out;
}
.rail.expanded{width:260px;}
.rail.is-collapsed{width:64px; align-items:center;}
.brand-row{display:flex; align-items:center; gap:var(--spacing-10); height:40px; padding:0 var(--spacing-8); margin-bottom:var(--spacing-8); flex:0 0 auto;}
.brand-row .name{font:var(--title-medium); letter-spacing:.15px; color:var(--neutral-900); white-space:nowrap; overflow:hidden;}
.new-btn{
  display:flex; align-items:center; gap:var(--spacing-10); height:40px; padding:0 var(--spacing-12);
  margin:0 0 var(--spacing-8); border:0; border-radius:var(--radius-sm);
  background:var(--primary); color:var(--base-white); font:var(--label-large); letter-spacing:.1px; cursor:pointer; flex:0 0 auto; white-space:nowrap;
}
.new-btn:hover{background:var(--primary-background-hover);}
.section-label{font:var(--label-small); letter-spacing:.5px; color:var(--neutral-500); text-transform:uppercase; padding:var(--spacing-12) var(--spacing-12) var(--spacing-4); flex:0 0 auto;}
.nav-item{
  display:flex; align-items:center; gap:var(--spacing-12); height:40px; padding:0 var(--spacing-12);
  border:0; border-radius:var(--radius-sm); background:transparent; color:var(--neutral-700);
  font:var(--label-large); letter-spacing:.1px; cursor:pointer; flex:0 0 auto; white-space:nowrap; width:100%;
}
.nav-item .icon{display:flex; flex-shrink:0;}
.nav-item:hover{background:var(--neutral-100); color:var(--neutral-900);}
.nav-item.is-active{background:var(--primary-light-background); color:var(--primary); font-weight:600;}
.footer-row{margin-top:auto; border-top:1px solid var(--neutral-200); padding-top:var(--spacing-8); flex:0 0 auto; width:100%;}
.rail.is-collapsed .brand-row .name, .rail.is-collapsed .nav-item .label,
.rail.is-collapsed .new-btn .label, .rail.is-collapsed .section-label{display:none;}
.rail.is-collapsed .nav-item, .rail.is-collapsed .new-btn{width:40px; padding:0; justify-content:center;}
.rail.is-collapsed .footer-row .icon svg{transform:rotate(180deg);}

/* ---------- views (main content pages, switched by the rail nav) ---------- */
.view{display:flex; flex-direction:column; gap:var(--spacing-16);}
.view[hidden]{display:none;}
.empty-note{font:var(--body-small); letter-spacing:.4px; color:var(--neutral-500); font-style:italic; padding:var(--spacing-8) 0;}
.group-title{font:var(--label-small); letter-spacing:.5px; color:var(--neutral-500); text-transform:uppercase;
  padding-bottom:var(--spacing-4); border-bottom:1px solid var(--neutral-200); margin-bottom:var(--spacing-4);}

/* full-page list cards (Risks, Invoices) */
.list-card{background:var(--base-white); border-radius:var(--radius-sm); box-shadow:var(--elevation-02); padding:var(--spacing-16); cursor:pointer; transition:box-shadow 150ms ease-out;}
.list-card:hover{box-shadow:var(--elevation-04);}
.list-card-top{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-12); margin-bottom:var(--spacing-8);}
.list-card-name{font:var(--title-small); letter-spacing:.1px; color:var(--primary); font-weight:600;}
.list-card-body{font:var(--body-medium); letter-spacing:.25px; color:var(--neutral-900);}
.list-card-body .rt-p:last-child{margin-bottom:0;}
.list-card-foot{font:var(--label-small); letter-spacing:.5px; color:var(--neutral-600); margin-top:var(--spacing-8);}
.list-card-grid{display:flex; flex-direction:column; gap:var(--spacing-12);}

/* donut charts (hand-drawn SVG, no chart library) */
.donut-wrap{position:relative; display:inline-flex; flex-shrink:0;}
.donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
.donut-center-value{font:var(--title-large); letter-spacing:0; color:var(--neutral-900);}
.donut-center-label{font:var(--label-small); letter-spacing:.5px; color:var(--neutral-600); text-transform:uppercase;}
.legend{display:flex; flex-direction:column; gap:var(--spacing-6);}
.legend-row{display:flex; align-items:center; gap:var(--spacing-8); font:var(--body-small); letter-spacing:.4px; color:var(--neutral-700);}
.legend-dot{width:9px; height:9px; border-radius:var(--radius-full); flex-shrink:0;}
.legend-label{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.legend-pct{font-weight:600; color:var(--neutral-900); flex-shrink:0;}

/* utilization: one card per resource */
.util-card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:var(--spacing-16);}
.util-card{background:var(--base-white); border-radius:var(--radius-sm); box-shadow:var(--elevation-02); padding:var(--spacing-16);
  display:flex; flex-direction:column; align-items:center; gap:var(--spacing-12); text-align:center;}
.util-card-top{display:flex; flex-direction:column; align-items:center; gap:var(--spacing-6);}
.util-card-name{font:var(--title-small); letter-spacing:.1px; color:var(--neutral-900);}
.util-card .legend{width:100%; text-align:left;}

/* revenue: donut + ranked bars */
.revenue-grid{display:grid; grid-template-columns:minmax(220px,320px) 1fr; gap:var(--spacing-24); align-items:start;}
.donut-panel{background:var(--base-white); border-radius:var(--radius-sm); box-shadow:var(--elevation-02); padding:var(--spacing-20);
  display:flex; flex-direction:column; align-items:center; gap:var(--spacing-16);}
.donut-panel .legend{width:100%;}
.bar-panel{display:flex; flex-direction:column; gap:var(--spacing-12);}
.bar-row{cursor:pointer; padding:var(--spacing-4) 0;}
.bar-row-top{display:flex; justify-content:space-between; gap:var(--spacing-8); margin-bottom:var(--spacing-4);}
.bar-row-name{font:var(--body-medium); letter-spacing:.25px; color:var(--neutral-900); font-weight:600;}
.bar-row-value{font:var(--label-small); letter-spacing:.5px; color:var(--neutral-600);}
.bar-track{height:8px; border-radius:var(--radius-full); background:var(--neutral-100); overflow:hidden;}
.bar-fill{height:100%; border-radius:var(--radius-full);}
.rev-summary{margin-bottom:var(--spacing-16);}
.rev-legend{display:flex; gap:var(--spacing-24); flex-wrap:wrap; margin-bottom:var(--spacing-12);}
.rev-legend-item{display:flex; align-items:center; gap:var(--spacing-8); font:var(--label-large); color:var(--neutral-900);}
.rev-swatch{width:14px; height:14px; border-radius:var(--radius-2xs); flex-shrink:0;}
.rev-swatch.total{background:color-mix(in srgb, var(--primary) 22%, var(--base-white));}
.rev-swatch.recognized{background:var(--primary);}
.rev-bar-track{position:relative; height:14px; border-radius:var(--radius-full); background:var(--neutral-100); overflow:hidden;}
.rev-bar-total{position:absolute; left:0; top:0; bottom:0; border-radius:var(--radius-full); background:color-mix(in srgb, var(--primary) 22%, var(--base-white));}
.rev-bar-recognized{position:absolute; left:0; top:0; bottom:0; border-radius:var(--radius-full); background:var(--primary);}
.rev-bar-figures{display:flex; justify-content:space-between; gap:var(--spacing-8); margin-top:var(--spacing-4); font:var(--label-small); letter-spacing:.4px; color:var(--neutral-600);}
.rev-bar-figures b{color:var(--neutral-900); font-weight:600;}
.rev-over{color:var(--error-foreground); font-weight:600;}
.rev-donut-note{font:var(--label-small); letter-spacing:.4px; color:var(--neutral-600); text-align:center;}
.legend-row.rev-total-row{border-top:1px solid var(--neutral-200); padding-top:var(--spacing-8); margin-top:var(--spacing-4);}
@media (max-width:900px){ .revenue-grid{grid-template-columns:1fr;} }

/* ---------- app header ---------- */
.app-header{
  height:56px; flex:0 0 auto;
  display:flex; align-items:center; gap:var(--spacing-16);
  padding:0 var(--spacing-20);
  background:var(--surface-app-header);
  border:1px solid var(--neutral-200);
  border-radius:var(--radius-md);
}
.app-header .zone-l{display:flex; align-items:center; gap:var(--spacing-12); min-width:0;}
.app-header .zone-c{flex:1;}
.app-header .zone-r{display:flex; align-items:center; gap:var(--spacing-8); flex:0 0 auto;}
.app-header .title{font:var(--title-medium); letter-spacing:.15px; color:var(--neutral-900);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.app-header .sub{font:var(--body-small); letter-spacing:.4px; color:var(--neutral-600);}

.ai-mark{display:inline-flex; align-items:center; justify-content:center; color:var(--primary); flex-shrink:0;}
.ai-mark svg{display:block;}

/* ---------- alert banner (local-only mode) ---------- */
.alert-banner{
  display:flex; align-items:center; gap:var(--spacing-8);
  background:var(--warning-light-background); color:var(--warning-foreground);
  border-radius:var(--radius-sm); padding:var(--spacing-12) var(--spacing-16);
  font:var(--body-medium); letter-spacing:.25px;
}
.alert-banner svg{flex-shrink:0;}

/* ---------- kpi row ---------- */
.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:var(--spacing-16);}
.kpi-tile{background:var(--base-white); border-radius:var(--radius-sm); box-shadow:var(--elevation-02);
  padding:var(--spacing-16); min-width:0;}
.kpi-label{font:var(--label-medium); letter-spacing:.5px; color:var(--neutral-600); text-transform:uppercase; margin-bottom:var(--spacing-6);}
.kpi-value{font:var(--headline-small); letter-spacing:0; color:var(--neutral-900);}
.kpi-sub{font:var(--body-small); letter-spacing:.4px; color:var(--neutral-600); margin-top:var(--spacing-2);}
.kpi-rag-row{display:flex; gap:var(--spacing-12); align-items:baseline; flex-wrap:wrap;}
.kpi-rag-dot{display:inline-block; width:8px; height:8px; border-radius:var(--radius-full); margin-right:var(--spacing-4); vertical-align:middle;}

/* ---------- buttons ---------- */
.btn{
  font:var(--label-large); letter-spacing:.1px;
  display:inline-flex; align-items:center; justify-content:center;
  gap:var(--spacing-4);
  border:1px solid transparent;
  border-radius:var(--radius-sm);
  cursor:pointer; user-select:none;
  transition:background 120ms ease-out, color 120ms ease-out, box-shadow 120ms ease-out;
}
.btn-sm{height:32px; padding:0 var(--spacing-16);}
.btn-md{height:36px; padding:0 18px;}
.btn-lg{height:40px; padding:0 var(--spacing-20);}

.btn-filled{background:var(--primary); color:var(--base-white);}
.btn-filled:hover{background:var(--primary-background-hover);}
.btn-filled:active{background:var(--primary-background-pressed);}

.btn-outlined{background:var(--base-white); color:var(--primary); border-color:var(--primary);}
.btn-outlined:hover{background:var(--primary-light-background); color:var(--primary-background-hover); border-color:var(--primary-background-hover); box-shadow:inset 0 0 0 1px var(--primary-background-hover);}
.btn-outlined:active{background:var(--primary-background-pressed); color:var(--base-white); border-color:var(--primary-background-pressed);}

.btn-text{background:transparent; color:var(--primary); padding-left:var(--spacing-12); padding-right:var(--spacing-12);}
.btn-text:hover{background:var(--neutral-100); color:var(--primary-background-hover);}
.btn-text:active{background:transparent; color:var(--primary-background-pressed);}

.btn-destructive{background:var(--error-foreground); color:var(--base-white);}
.btn-destructive:hover{background:#A01320;}
.btn-destructive:active{background:#7F0F19;}

.btn-icon{width:36px; padding:0;}
.btn-icon.btn-sm{width:32px;}
.btn-icon.btn-lg{width:40px;}
.btn[disabled]{opacity:.5; pointer-events:none;}

/* ---------- text field ---------- */
.field{display:flex; flex-direction:column; gap:var(--spacing-4); width:100%;}
.field>.label{font:var(--label-medium); letter-spacing:.5px; color:var(--neutral-900);}
.field-wrap{
  display:flex; align-items:center; gap:var(--spacing-8);
  background:var(--base-white);
  border:1px solid var(--neutral-600);
  border-radius:var(--radius-sm);
  padding:10px var(--spacing-16);
  height:40px;
}
.field-wrap svg{flex-shrink:0; color:var(--neutral-600);}
.field-wrap input, .field-wrap select, .field-wrap textarea{
  flex:1; border:0; outline:0; background:transparent;
  font:500 14px/20px var(--font-family); letter-spacing:.1px;
  color:var(--neutral-900); width:100%; padding:0;
}
.field-wrap select{appearance:none; cursor:pointer;}
.field-wrap textarea{resize:vertical; font-weight:400; padding:8px 0;}
.field-wrap input::placeholder, .field-wrap textarea::placeholder{color:var(--neutral-600); font-weight:500;}
.field-wrap:has(textarea){height:auto; align-items:flex-start;}
.field-wrap:focus-within{border-color:var(--primary);}
.field .helper{display:flex; align-items:center; gap:var(--spacing-6); font:var(--label-small); letter-spacing:.5px; color:var(--neutral-600);}

/* ---------- week-jump trigger (opens calendar-popup) + the popup itself ---------- */
.week-jump-trigger{
  display:flex; align-items:center; gap:var(--spacing-8);
  background:var(--base-white);
  border:1px solid var(--neutral-600);
  border-radius:var(--radius-sm);
  padding:0 var(--spacing-16);
  height:40px; width:100%;
  font:500 14px/20px var(--font-family); letter-spacing:.1px; color:var(--neutral-900);
  cursor:pointer; text-align:left;
}
.week-jump-trigger:hover{background:var(--neutral-100);}
.week-jump-trigger svg{flex-shrink:0; color:var(--neutral-600);}
.week-jump-trigger span{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.calendar-popup{
  position:fixed; z-index:80; width:280px;
  background:var(--base-white);
  border:1px solid var(--neutral-200);
  border-radius:var(--radius-md);
  box-shadow:var(--elevation-modal);
  padding:var(--spacing-16);
}
.calendar-popup[hidden]{display:none;}
.calendar-popup-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:var(--spacing-12);}
.calendar-popup-title{font:var(--title-small); letter-spacing:.1px; color:var(--neutral-900);}
.cal-nav-btn{
  display:flex; align-items:center; justify-content:center;
  width:28px; height:28px; border:0; border-radius:var(--radius-full);
  background:transparent; color:var(--neutral-700); cursor:pointer;
}
.cal-nav-btn:hover{background:var(--neutral-100); color:var(--neutral-900);}
.calendar-popup-weekdays{display:grid; grid-template-columns:repeat(7, 1fr); text-align:center; margin-bottom:var(--spacing-4);}
.calendar-popup-weekdays span{font:var(--label-small); letter-spacing:.5px; color:var(--neutral-500); text-transform:uppercase;}
.calendar-popup-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:2px;}
.cal-day{
  height:32px; border:0; background:transparent; border-radius:var(--radius-xs);
  font:var(--body-small); font-size:13px; letter-spacing:.2px; color:var(--neutral-900); cursor:pointer;
}
.cal-day:hover{background:var(--neutral-100);}
.cal-day.is-outside{color:var(--neutral-400);}
.cal-day.is-in-range{background:var(--primary-light-background); color:var(--primary); font-weight:600; border-radius:0;}
.cal-day.is-in-range:hover{background:var(--primary-light-background);}
.cal-day.is-range-edge-l{border-radius:var(--radius-full) 0 0 var(--radius-full);}
.cal-day.is-range-edge-r{border-radius:0 var(--radius-full) var(--radius-full) 0;}
.cal-day.is-range-single{border-radius:var(--radius-full);}
.cal-day.is-today{box-shadow:inset 0 0 0 1.5px var(--primary);}
.calendar-popup-range-row{padding-top:var(--spacing-8); text-align:center;}
.calendar-popup-foot{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-8); margin-top:var(--spacing-4); padding-top:var(--spacing-8); border-top:1px solid var(--neutral-200);}
.calendar-popup-hint{font:var(--label-small); letter-spacing:.3px; color:var(--neutral-500);}
#calendar-popup-apply:disabled{opacity:.5; cursor:not-allowed;}

/* ---------- tags (read-only status) ---------- */
.tag{
  display:inline-flex; align-items:center; gap:var(--spacing-4);
  height:24px; padding:0 var(--spacing-8);
  border-radius:var(--radius-full);
  font:var(--label-large); font-weight:500; letter-spacing:.1px;
  border:1px solid transparent; white-space:nowrap;
}
.tag-neutral{background:var(--neutral-100); color:var(--neutral-900);}
.tag-primary{background:var(--primary-light-background); color:var(--primary);}
.tag-success{background:var(--success-light-background); color:var(--success-foreground);}
.tag-error{background:var(--error-light-background); color:var(--error-foreground);}
.tag-warning{background:var(--warning-light-background); color:var(--warning-foreground);}
.tag-info{background:var(--info-light-background); color:var(--info-foreground);}

/* ---------- chips (interactive) ---------- */
.chip{
  display:inline-flex; align-items:center; gap:var(--spacing-6);
  height:32px; padding:0 var(--spacing-12);
  border-radius:var(--radius-full);
  font:var(--label-large); letter-spacing:.1px;
  background:var(--base-white);
  border:1px solid var(--neutral-300);
  color:var(--neutral-900);
  cursor:pointer;
}
.chip:hover{background:var(--neutral-100);}
.chip.is-selected{background:var(--primary-light-background); border-color:var(--primary); color:var(--primary);}

/* ---------- toolbar ---------- */
.toolbar{display:flex; align-items:center; gap:var(--spacing-12); flex-wrap:wrap;}
.toolbar .field{max-width:280px;}
.chip-filter-group{display:flex; gap:var(--spacing-6); flex-wrap:wrap;}
.week-jump-toolbar{max-width:190px;}
.sort-field{margin-left:auto; min-width:200px;}
.sort-field .field-wrap{position:relative;}
.sort-field select{padding-right:var(--spacing-16);}
.caret-wrap{display:flex; align-items:center; pointer-events:none;}

/* ---------- card grid + project card ---------- */
.card-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:var(--spacing-16);}
.card{
  background:var(--base-white);
  border-radius:var(--radius-sm);
  box-shadow:var(--elevation-02);
  padding:var(--spacing-16);
  transition:box-shadow 150ms ease-out;
}
.pcard{display:flex; flex-direction:column; gap:var(--spacing-12); cursor:pointer;}
.pcard:hover{box-shadow:var(--elevation-04);}
.pcard .project-name{font:var(--title-medium); letter-spacing:.15px; color:var(--neutral-900); min-height:32px; display:flex; align-items:center;}
.client-card .card-logo{height:44px;}
.pcard[data-accent-client], .client-card{
  border-top:4px solid var(--accent, var(--neutral-200));
  background:color-mix(in srgb, var(--accent, transparent) 6%, var(--base-white));
}
.client-card .meta-row .v{color:var(--accent, var(--neutral-900)); font-size:14px;}
.client-card hr{border-top-color:color-mix(in srgb, var(--accent, var(--neutral-300)) 30%, var(--neutral-200));}
.client-bar{display:flex; align-items:center; gap:var(--spacing-16); flex-wrap:wrap; margin-bottom:var(--spacing-16);}
.client-bar .client-bar-title{display:flex; flex-direction:column; gap:var(--spacing-4); margin-right:auto;}
.client-bar .client-bar-title .sub{font:var(--label-small); letter-spacing:.5px; color:var(--neutral-600);}
.detail-project-name{font:var(--title-medium); letter-spacing:.15px; color:var(--neutral-900);}
.weekly-project-name{font:var(--label-large); color:var(--neutral-700);}
.pcard hr{border:0; border-top:1px solid var(--neutral-200); margin:0;}
.pcard .status-row{display:flex; justify-content:space-between; align-items:center; gap:var(--spacing-8);}
.pcard .avatars{display:flex;}
.pcard .avatars span{
  width:24px; height:24px; border-radius:var(--radius-full); border:2px solid var(--base-white);
  margin-left:-8px; display:flex; align-items:center; justify-content:center;
  font:var(--label-small); letter-spacing:0; color:var(--base-white);
}
.pcard .avatars span:first-child{margin-left:0;}
.pcard .meta{display:flex; flex-direction:column; gap:var(--spacing-10);}
.pcard .meta-row{display:flex; gap:var(--spacing-8); align-items:baseline;}
.pcard .meta-row .k{font:var(--body-small); letter-spacing:.4px; color:var(--neutral-600); width:78px; flex-shrink:0;}
.pcard .meta-row .v{font:700 12px/16px var(--font-family); letter-spacing:0; color:var(--neutral-900); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.pcard .footer{display:flex; justify-content:space-between; align-items:center; margin-top:auto; gap:var(--spacing-8);}
.pcard .ts{font:var(--label-small); letter-spacing:.5px; color:var(--neutral-600); display:flex; align-items:center; gap:var(--spacing-4); min-width:0;}
.pcard .ts span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

.empty-state{text-align:center; padding:var(--spacing-48) var(--spacing-20); color:var(--neutral-600);}
.empty-state h3{font:var(--title-medium); letter-spacing:.15px; color:var(--neutral-900); margin-bottom:var(--spacing-8);}

/* ---------- overlays (modal + detail panel) ---------- */
.overlay{position:fixed; inset:0; background:rgba(35,31,32,.4); display:flex; justify-content:flex-end; z-index:50;}
.overlay[hidden]{display:none;}
.detail-panel{
  width:min(760px,100%); height:100%; background:var(--base-white);
  border-radius:var(--radius-md) 0 0 var(--radius-md);
  box-shadow:var(--elevation-modal);
  display:flex; flex-direction:column; overflow:hidden;
}
.detail-header{border-bottom:1px solid var(--neutral-200); padding:var(--spacing-24) var(--spacing-24) 0; flex:0 0 auto;}
.detail-header-top{display:flex; justify-content:space-between; align-items:flex-start; gap:var(--spacing-12);}
.detail-name-row{display:flex; align-items:center; gap:var(--spacing-10); flex-wrap:wrap;}
.detail-name{font:var(--title-large); letter-spacing:0; color:var(--neutral-900);}
.detail-meta-row{display:flex; gap:var(--spacing-16); flex-wrap:wrap; color:var(--neutral-600); font:var(--body-small); letter-spacing:.4px; margin:var(--spacing-8) 0 var(--spacing-16);}
.detail-meta-row b{color:var(--neutral-900); font-weight:600;}
.detail-kpis{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:var(--spacing-16); margin-bottom:var(--spacing-16);}
.detail-kpi-label{font:var(--label-medium); letter-spacing:.5px; color:var(--neutral-600); text-transform:uppercase;}
.detail-kpi-value{font:var(--title-large); letter-spacing:0; color:var(--neutral-900); margin-top:var(--spacing-2);}
.progress-track{height:6px; border-radius:var(--radius-full); background:var(--neutral-200); overflow:hidden; margin-top:var(--spacing-6);}
.progress-fill{height:100%; background:var(--primary); border-radius:var(--radius-full);}

.tabs{display:flex; gap:var(--spacing-24); border-bottom:1px solid var(--neutral-200);}
.tab{
  border:0; background:transparent; padding:var(--spacing-8) 0;
  font:500 16px/24px var(--font-family); letter-spacing:.5px;
  color:var(--neutral-600); cursor:pointer; position:relative;
  display:flex; align-items:center; gap:var(--spacing-8); margin-bottom:-1px;
}
.tab.is-active{color:var(--primary);}
.tab.is-active::after{content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--primary); border-radius:2px 2px 0 0;}

.detail-body{flex:1 1 auto; overflow-y:auto; padding:var(--spacing-24);}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:var(--spacing-16);}
.form-wide{grid-column:1/-1;}
.form-actions{display:flex; justify-content:flex-end; gap:var(--spacing-12); margin-top:var(--spacing-4);}
.form-actions.spread{justify-content:space-between;}

.scope-toolbar{display:flex; justify-content:flex-end; margin-bottom:var(--spacing-12);}
.scope-render{font:var(--body-medium); letter-spacing:.25px; color:var(--neutral-900);}
.scope-edit textarea{width:100%; min-height:420px; font:var(--body-small); letter-spacing:.4px; line-height:1.6;
  border:1px solid var(--neutral-600); border-radius:var(--radius-sm); padding:var(--spacing-16); color:var(--neutral-900);}
.scope-edit textarea:focus-visible{outline:0; border-color:var(--primary);}

.rt-heading{font:var(--label-small); letter-spacing:.5px; color:var(--neutral-500); text-transform:uppercase;
  padding:var(--spacing-12) 0 var(--spacing-4); font-weight:600;}
.rt-heading:first-child{padding-top:0;}
.rt-p{margin:0 0 var(--spacing-10);}
.rt-list{margin:0 0 var(--spacing-10); padding-left:var(--spacing-20);}
.rt-list li{margin-bottom:var(--spacing-4);}
.rt-empty{color:var(--neutral-500); font-style:italic;}

/* ---------- weekly activity (Activity tab) ---------- */
.week-jump{max-width:220px; margin-bottom:var(--spacing-12);}
.period-picker{max-width:none; margin-bottom:var(--spacing-12);}
.period-row{display:flex; align-items:center; gap:var(--spacing-8); flex-wrap:wrap;}
.period-row .field-wrap{flex:1 1 220px; max-width:300px;}
.period-row .week-jump-trigger{width:auto; flex:0 0 auto; padding:0 var(--spacing-12);}
.carry-note{font:var(--label-small); letter-spacing:.3px; color:var(--neutral-600); background:var(--neutral-100); border-radius:var(--radius-sm); padding:var(--spacing-8) var(--spacing-12); margin-bottom:var(--spacing-12);}
.week-chips{display:flex; gap:var(--spacing-6); flex-wrap:wrap;}
.quick-weeks{margin-bottom:var(--spacing-16);}

/* weekly report (all accounts, one week, on the main dashboard) */
.weekly-toolbar{display:flex; align-items:flex-end; justify-content:space-between; gap:var(--spacing-16); flex-wrap:wrap;}
.print-only{display:none;}
.weekly-account-head .head-left{display:flex; align-items:center; gap:var(--spacing-12); flex-wrap:wrap; min-width:0;}
.report-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:var(--spacing-16);}
.report-section{display:flex; flex-direction:column; gap:var(--spacing-8); min-width:0; break-inside:avoid;}
.report-section-title{font:var(--label-medium); letter-spacing:.5px; color:var(--neutral-600); text-transform:uppercase;}
.report-deadline{margin-top:var(--spacing-8); font:var(--label-large); color:var(--neutral-900);}
@media print{
  @page{margin:14mm;}
  html,body{background:#fff !important;}
  .rail, .app-header, .alert-banner, .no-print, .week-jump, .period-picker, .week-chips, .toast, .calendar-popup, .overlay, .modal-overlay{display:none !important;}
  .shell{display:block; padding:0; min-height:0;}
  .page-content{border:0; padding:0; border-radius:0; display:block;}
  .print-only{display:block;}
  .print-title{font:var(--headline-small); margin-bottom:var(--spacing-4);}
  .print-sub{font:var(--body-medium); color:var(--neutral-700); margin-bottom:var(--spacing-16);}
  .weekly-account{box-shadow:none; border:1px solid var(--neutral-300); break-inside:avoid; margin-bottom:var(--spacing-12);}
  .weekly-account-head{cursor:default;}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
}
.weekly-account-list{display:flex; flex-direction:column; gap:var(--spacing-16);}
.weekly-account{background:var(--base-white); border-radius:var(--radius-sm); box-shadow:var(--elevation-02); padding:var(--spacing-20); display:flex; flex-direction:column; gap:var(--spacing-16);}
.weekly-account-head{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-12); cursor:pointer; padding-bottom:var(--spacing-16); border-bottom:1px solid var(--neutral-200);}
.week-chip-dot{display:inline-block; width:6px; height:6px; border-radius:var(--radius-full); background:var(--primary); margin-left:var(--spacing-2);}
.week-fields{display:flex; flex-direction:column; gap:var(--spacing-16);}
.week-fields .tabs{margin-top:calc(var(--spacing-4) * -1);}
.week-fields .field-wrap textarea{min-height:64px;}

/* ---------- brand logo (cards + detail header) ---------- */
.card-logo{display:flex; align-items:center; height:32px; max-width:100%;}
.card-logo svg, .card-logo-img{height:100%; width:auto; max-width:100%; object-fit:contain;}
.card-logo-fallback{font:var(--body-medium); letter-spacing:.25px; color:var(--primary); font-weight:600; height:auto;}
.detail-logo{display:flex; align-items:center; height:36px; max-width:260px;}
.detail-logo svg, .detail-logo-img{height:100%; width:auto; max-width:100%; object-fit:contain;}
.detail-logo-fallback{font:var(--title-large); letter-spacing:0; color:var(--neutral-900); height:auto;}

.roles-table{width:100%; border-collapse:collapse; margin-bottom:var(--spacing-12);}
.roles-table th{text-align:left; font:var(--label-medium); letter-spacing:.5px; color:var(--neutral-600); text-transform:uppercase; padding:0 var(--spacing-8) var(--spacing-8) 0;}
.roles-table td{padding:var(--spacing-4) var(--spacing-8) var(--spacing-4) 0; vertical-align:middle;}
.roles-table td:first-child{width:32%;}
.roles-table td.pct-cell{width:130px;}
.roles-table td:last-child{width:76px; white-space:nowrap;}
.status-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:var(--spacing-16); margin-bottom:var(--spacing-16);}
.status-card{background:var(--base-white); border-radius:var(--radius-sm); box-shadow:var(--elevation-02); padding:var(--spacing-16); display:flex; flex-direction:column; gap:var(--spacing-8);}
.status-card .status-card-title{font:var(--label-large); letter-spacing:.1px; color:var(--neutral-900); display:flex; align-items:center; gap:var(--spacing-8);}
.status-card .status-dot{width:8px; height:8px; border-radius:var(--radius-full); flex-shrink:0;}
.roles-table .field-wrap{height:36px; padding:0 var(--spacing-12);}

/* ---------- add-account modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(35,31,32,.4); display:flex; align-items:center; justify-content:center; z-index:60; padding:var(--spacing-20);}
.modal-overlay[hidden]{display:none;}
.modal{background:var(--base-white); border-radius:var(--radius-md); box-shadow:var(--elevation-modal); width:min(560px,100%); max-height:90vh; overflow-y:auto; padding:var(--spacing-24);}
.modal h2{font:var(--title-medium); letter-spacing:.15px; color:var(--neutral-900); margin-bottom:var(--spacing-16);}
.modal-wide{width:min(720px,100%);}
.import-hint{font:var(--body-small); letter-spacing:.3px; color:var(--neutral-600); margin-bottom:var(--spacing-16);}
.import-preview-list{display:flex; flex-direction:column; gap:var(--spacing-12); max-height:50vh; overflow-y:auto; margin-bottom:var(--spacing-16);}
.import-row{border:1px solid var(--neutral-200); border-radius:var(--radius-sm); padding:var(--spacing-12) var(--spacing-16);}
.import-row-head{display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-12);}
.import-row-name{font:var(--label-large); letter-spacing:.1px; color:var(--neutral-900);}
.import-row-changes{font:var(--body-small); letter-spacing:.3px; color:var(--neutral-700); margin-top:var(--spacing-6);}
.import-row.is-new .import-row-name{color:var(--primary);}
.import-row.is-skipped{opacity:.55;}

/* ---------- toast ---------- */
.toast{
  position:fixed; bottom:var(--spacing-24); left:50%; transform:translateX(-50%) translateY(10px);
  background:var(--base-white); border-radius:var(--radius-md); box-shadow:var(--elevation-toast);
  padding:var(--spacing-10) var(--spacing-16) var(--spacing-10) var(--spacing-12);
  display:flex; align-items:center; gap:var(--spacing-8);
  border-left:4px solid var(--neutral-400);
  font:var(--body-small); letter-spacing:.4px; color:var(--neutral-700);
  z-index:100; opacity:0; transition:opacity 150ms ease-out, transform 150ms ease-out; pointer-events:none;
}
.toast.is-visible{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.t-success{border-left-color:var(--success-foreground);}
.toast.t-error{border-left-color:var(--error-foreground);}
.toast.t-info{border-left-color:var(--primary);}

@media (max-width:900px){
  .shell{flex-direction:column;}
  .rail, .rail.expanded, .rail.is-collapsed{width:100%; flex-direction:row; align-items:center; position:static; height:auto; overflow-x:auto; gap:var(--spacing-8);}
  .brand-row, .section-label, .footer-row{display:none;}
  #nav-list{display:contents;}
  .new-btn, .nav-item{width:auto; flex:0 0 auto;}
}
@media (max-width:640px){
  .shell{padding:var(--spacing-8);}
  .page-content{padding:var(--spacing-16);}
  .form-grid{grid-template-columns:1fr;}
  .detail-body{padding:var(--spacing-16);}
}

/* Motion policy: every transition/animation is inert under reduced motion. */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>
<body>

<div class="shell">
  <aside class="rail expanded" id="app-rail" aria-label="Primary">
    <div class="brand-row">
      <span class="ai-mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1 L22 6.5 L22 17.5 L12 23 L2 17.5 L2 6.5 Z"/></svg>
      </span>
      <span class="name">GEO Tracker</span>
    </div>
    <button type="button" class="new-btn ring-focus" id="btn-add-account">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label">New account</span>
    </button>
    <button type="button" class="nav-item ring-focus" id="btn-import-excel" title="Import from Excel">
      <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></span>
      <span class="label">Import from Excel</span>
    </button>
    <div id="nav-list"></div>
    <div class="footer-row">
      <button type="button" class="nav-item ring-focus" id="btn-toggle-rail" title="Collapse sidebar" aria-label="Collapse sidebar">
        <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6 8 12l6 6"/></svg></span>
        <span class="label">Collapse</span>
      </button>
    </div>
  </aside>

  <section class="page-content">
    <header class="app-header">
      <div class="zone-l">
        <div>
          <div class="title" id="header-title">GEO Delivery Tracker</div>
          <div class="sub" id="header-sub">Active engagements &middot; source of truth</div>
        </div>
      </div>
      <div class="zone-c"></div>
      <div class="zone-r"></div>
    </header>

    <div class="view" id="view-accounts">
      <section class="kpi-row" id="kpi-strip"></section>

      <section class="toolbar">
        <div class="field">
          <div class="field-wrap">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search-input" type="search" placeholder="Search accounts&hellip;" aria-label="Search accounts">
          </div>
        </div>
        <div class="chip-filter-group" id="rag-filter" role="group" aria-label="Filter by RAG status"></div>
        <label class="field week-jump-toolbar">
          <span class="label">Jump to a period</span>
          <button type="button" class="week-jump-trigger" id="accounts-week-jump-btn" aria-haspopup="dialog">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span id="accounts-week-jump-label">Pick a date range&hellip;</span>
          </button>
        </label>
        <div class="field sort-field">
          <div class="field-wrap">
            <select id="sort-select" aria-label="Sort accounts">
              <option value="severity">Needs attention first</option>
              <option value="order">Original order</option>
              <option value="name">Name (A&ndash;Z)</option>
              <option value="revenue">Revenue (high&ndash;low)</option>
            </select>
            <span class="caret-wrap" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </span>
          </div>
        </div>
      </section>

      <div class="client-bar" id="client-bar" hidden></div>
      <main class="card-grid" id="card-grid"></main>
      <div class="empty-state" id="empty-state" hidden>
        <h3>No accounts match your filters</h3>
        <p>Try clearing the search or RAG filter.</p>
      </div>
    </div>

    <div class="view" id="view-weekly" hidden>
      <div id="view-weekly-body"></div>
    </div>

    <div class="view" id="view-utilization" hidden>
      <div id="view-utilization-body"></div>
    </div>

    <div class="view" id="view-risks" hidden>
      <div id="view-risks-body"></div>
    </div>

    <div class="view" id="view-invoices" hidden>
      <div id="view-invoices-body"></div>
    </div>

    <div class="view" id="view-revenue" hidden>
      <div id="view-revenue-body"></div>
    </div>
  </section>
</div>

<div class="overlay" id="detail-overlay" hidden>
  <div class="detail-panel" role="dialog" aria-modal="true" aria-label="Account details">
    <div class="detail-header" id="detail-header"></div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</div>

<div class="modal-overlay" id="add-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Add account">
    <h2 id="add-modal-title">New account</h2>
    <form id="add-form" class="form-grid">
      <label class="field form-wide" id="add-client-name-field">
        <span class="label">Client / brand name</span>
        <div class="field-wrap"><input name="name" required placeholder="e.g. Regeneron"></div>
      </label>
      <label class="field form-wide">
        <span class="label">Project name</span>
        <div class="field-wrap"><input name="projectName" required value="GEO Engagement" placeholder="e.g. AI Listening Report"></div>
      </label>
      <label class="field">
        <span class="label">RAG status</span>
        <div class="field-wrap">
          <select name="rag">
            <option value="Green">Green</option>
            <option value="Amber" selected>Amber</option>
            <option value="Red">Red</option>
          </select>
        </div>
      </label>
      <label class="field">
        <span class="label">SOW status</span>
        <div class="field-wrap"><select name="sowStatus"></select></div>
      </label>
      <label class="field">
        <span class="label">Project status</span>
        <div class="field-wrap"><select name="projectStatus"></select></div>

  function $(sel, root){ return (root || document).querySelector(sel); }

  function esc(s){

  function slugify(name){
    var base = String(name || "account").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

  }

  function money(n){

  function fmtDate(iso){
    if (!iso) return "—";

  }

  function todayIso(){
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");

  }

  // ---- week helpers: every account is tracked on a Monday-anchored weekly cadence ----
  function isoFromDate(d){
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function mondayOf(d){
    var dd = new Date(d.getTime());
    var day = dd.getDay();
    var diff = (day === 0 ? -6 : 1 - day);

    dd.setHours(0, 0, 0, 0);

  }

  // A period key is either a bare Monday date ("2026-09-21", a legacy/canonical
  // Mon–Sun week) or a "from_to" pair for a custom-length, custom-start range.
  function periodBoundsFromKey(key){
    if (key.indexOf("_") !== -1) {
      var parts = key.split("_");
      return {from: parts[0], to: parts[1]};
    }
    var end = new Date(key + "T00:00:00");

    return {from: key, to: isoFromDate(end)};
  }

  // (so it lands on the same bucket legacy weekly data already lives in);
  // any other span gets an explicit "from_to" key.
  function periodKeyFor(from, to){
    var fromD = new Date(from + "T00:00:00");
    var expectedEnd = new Date(fromD.getTime());
    expectedEnd.setDate(expectedEnd.getDate() + 6);
    if (fromD.getDay() === 1 && isoFromDate(expectedEnd) === to) return from;
    return from + "_" + to;
  }
  function compareWeekKeysDesc(x, y){
    var bx = periodBoundsFromKey(x), by = periodBoundsFromKey(y);
    if (bx.from !== by.from) return bx.from < by.from ? 1 : -1;
    if (bx.to !== by.to) return bx.to < by.to ? 1 : -1;
    return 0;
  }
  function fmtShortDate(iso){
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-US", {month:"short", day:"numeric"});
  }
  function weekLabel(key){
    var b = periodBoundsFromKey(key);
    var start = new Date(b.from + "T00:00:00");
    if (isNaN(start.getTime())) return key;
    var end = new Date(b.to + "T00:00:00");
    var fmt = function(d){ return d.toLocaleDateString("en-US", {month:"short", day:"numeric"}); };
    if (b.from === b.to) return fmt(start);
    return fmt(start) + " – " + fmt(end);
  }
  // Only Current Status (completed / in progress / next steps) is per period.
  // Risk fields and scope-creep/change-request fields carry forward from the
  // most recent period where they were saved, and can be edited at any time.
  var RISK_FIELDS = ["risk", "mitigationActions", "mitigationDeadline"];
  var CHANGE_FIELDS = ["scopeCreep", "changeRequests"];
  function groupTouched(entry, group){
    if (!entry) return false;
    if (entry[group === "risk" ? "riskSaved" : "changesSaved"]) return true;
    return (group === "risk" ? RISK_FIELDS : CHANGE_FIELDS).some(function(f){ return entry[f] && String(entry[f]).trim(); });
  }
  function resolvedWeek(a, key){
    var out = Object.assign({}, weekData(a, key));
    var asOf = periodBoundsFromKey(key).from;
    var keys = Object.keys(a.weeks || {}).filter(function(k){ return periodBoundsFromKey(k).from <= asOf; }).sort(compareWeekKeysDesc);

      var src = null;
      for (var i = 0; i < keys.length; i++) { if (groupTouched(a.weeks[keys[i]], g[0])) { src = keys[i]; break; } }

  }
  function weekData(a, key){

  // ---- calendar popup: click-only custom date-range picker shared by all three "jump to a range" triggers ----

    var left = rect.left;

    var top = rect.bottom + 6;
    var popupHeight = 360;
    if (top + popupHeight > window.innerHeight - 8) top = Math.max(8, rect.top - popupHeight - 6);

    popup.style.top = top + "px";
  }

  function renderCalendarPopup(){
    var monthStart = new Date(calendarPopupMonth.getTime());
    $("#calendar-popup-title").textContent = monthStart.toLocaleDateString("en-US", {month:"long", year:"numeric"});

    gridStart.setDate(gridStart.getDate() - startDow);

    var today = todayIso();
    var from = calendarRangeFrom;
    var to = calendarRangeTo || calendarRangeFrom;

    var days = [];
    for (var i = 0; i < 42; i++) {
      var cellDate = new Date(gridStart.getTime());
      cellDate.setDate(cellDate.getDate() + i);
      days.push(isoFromDate(cellDate));

      var isToday = iso === today;
      var col = i % 7;

      var edgeR = inRange && (col === 6 || !nextInRange);
      var cls = "cal-day";
      if (!inMonth) cls += " is-outside";
      if (isToday) cls += " is-today";

  function ragClass(rag){

  var INVOICE_STATUS_OPTIONS = ["Not Scheduled", "Scheduled", "Due Soon", "Overdue", "Invoiced", "Fully invoiced", "Paid"];

    var today = todayIso();
    if (due < today) return "Overdue";
    var soon = new Date(today + "T00:00:00");
    soon.setDate(soon.getDate() + 7);
    if (due <= isoFromDate(soon)) return "Due Soon";
    return "Scheduled";
  }
  function effectiveInvoiceStatus(p){

  // Source logos vary a lot in built-in padding (a square icon+wordmark lockup

  // ---- hand-drawn SVG donut chart (no chart library) ----

    var r = (size - stroke) / 2;
    var c = size / 2;
    var circumference = 2 * Math.PI * r;
    var total = segments.reduce(function(s, x){ return s + (Number(x.value) || 0); }, 0);
    var html = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" role="img" aria-label="' + esc(opts.ariaLabel || "") + '">';
    html += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="var(--neutral-100)" stroke-width="' + stroke + '"/>';
    var offset = 0;
    if (total > 0) {
      segments.forEach(function(seg){
        var val = Number(seg.value) || 0;
        if (val <= 0) return;
        var len = (val / total) * circumference;
        html += '<circle cx="' + c + '" cy="' + c + '" r="' + r + '" fill="none" stroke="' + seg.color + '" stroke-width="' + stroke + '" ' +
          'stroke-dasharray="' + len + ' ' + (circumference - len) + '" stroke-dashoffset="' + (-offset) + '" ' +
          'transform="rotate(-90 ' + c + ' ' + c + ')" stroke-linecap="butt"><title>' + esc(seg.label || "") + '</title></circle>';
        offset += len;
      });
    }
    html += '</svg>';
    return '<div class="donut-wrap" style="width:' + size + 'px;height:' + size + 'px;">' + html + '<div class="donut-center">' + (opts.centerHtml || "") + '</div></div>';
  }

  // ---- rich text formatter for SOW blocks, updates, risks ----
  function formatRichText(raw){
    if (!raw || !String(raw).trim()) return '<p class="rt-empty">No details recorded.</p>';
    var text = String(raw).replace(/\r\n/g, "\n");
    var blocks = text.split(/\n{2,}/);
    var headMarker = /^(D\d+|WS\d+|TRACK\s*\d+|PART\s+[A-Z]|MILESTONE\s*\d*|CHECKPOINT\s*[\d.]*)\b/i;
    var html = "";
    for (var b = 0; b < blocks.length; b++) {
      var lines = blocks[b].split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
      if (!lines.length) continue;
      var idx = 0;
      var first = lines[0];
      var isHeading = (/^.{2,90}:$/.test(first) && first.indexOf("•") === -1) || headMarker.test(first);
      if (isHeading) {
        html += '<div class="rt-heading">' + esc(first.replace(/:$/, "")) + '</div>';
        idx = 1;
      }
      var inList = false;
      for (; idx < lines.length; idx++) {
        var line = lines[idx];
        var bulletMatch = line.match(/^[•\-*]\s*(.*)$/);
        if (bulletMatch && bulletMatch[1]) {
          if (!inList) { html += '<ul class="rt-list">'; inList = true; }
          html += "<li>" + esc(bulletMatch[1]) + "</li>";
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          var lm = line.match(/^([A-Z][A-Za-z0-9 &()\/]{1,40}:)\s+(.*)$/);
          if (lm) html += '<p class="rt-p"><strong>' + esc(lm[1]) + "</strong> " + esc(lm[2]) + "</p>";
          else html += '<p class="rt-p">' + esc(line) + "</p>";
        }
      }
      if (inList) html += "</ul>";
    }
    return html || '<p class="rt-empty">No details recorded.</p>';
  }

  function showToast(msg, variant){
    var t = $("#toast");
    t.className = "toast is-visible t-" + (variant || "success");
    t.textContent = msg;
    clearTimeout(showToast._h);
    showToast._h = setTimeout(function(){ t.classList.remove("is-visible"); }, 2600);
  }

  // ---------------- data layer (REST API backed by Postgres via server.js) ----------------
  function apiFetch(url, opts){
    return fetch(url, opts).then(function(r){
      if (!r.ok) return r.json().catch(function(){ return {}; }).then(function(body){
        throw new Error(body.error || (r.status + " " + r.statusText));
      });
      return r.json();
    });
  }

  // Storage is client docs, each holding a list of projects. The rest of the app
  // works on a flat list of projects ("accounts"), so flatten after every load.
  var clients = [];
  var currentClientId = null;
  var addContextClientId = null;

  // Roles are one row per person: {role, name, pct}. Older data stored
  // {role, value: "Name — 50%"}, possibly with several names in one value.
  function normalizeRoles(list){
    var out = [];
    (list || []).forEach(function(r){
      if (!r) return;
      if (r.name !== undefined || r.pct !== undefined) {
        out.push({role: r.role || "", name: r.name || "", pct: (r.pct === null || r.pct === undefined || r.pct === "") ? "" : Number(r.pct)});
        return;
      }
      var role = r.role || "", value = String(r.value || "").trim();
      if (!value) { out.push({role: role, name: "", pct: ""}); return; }
      var m = value.match(/^([\s\S]*?)[\s\u2014\u2013-]+(\d+(?:\.\d+)?)\s*%\s*$/);
      var namesPart = m ? m[1] : value;
      var pct = m ? parseFloat(m[2]) : "";
      var names = namesPart.split(/,|\/|\n/).map(function(x){ return x.trim(); }).filter(Boolean);
      if (!names.length) names = [namesPart.trim()];
      names.forEach(function(n){ out.push({role: role, name: n, pct: pct}); });
    });
    return out;
  }

  // Raised invoices per project: {id, number, date, amount}. When a project has
  // any, they are the source of truth for "invoiced to date" and for recognized revenue.
  function normalizeInvoices(list){
    return (Array.isArray(list) ? list : []).map(function(i){
      return {id: i.id || ("inv-" + Math.random().toString(36).slice(2, 8)), number: i.number || "", date: i.date || "", amount: Number(i.amount) || 0};
    });
  }

  function flattenClients(list){
    var out = [];
    list.forEach(function(c){
      var projs = c.projects || [];
      projs.forEach(function(p){
        var invList = normalizeInvoices(p.invoices);
        var fromList = invList.length > 0;
        var invoicedTotal = fromList ? invList.reduce(function(sum, i){ return sum + i.amount; }, 0) : (Number(p.invoicedToDate) || 0);
        var flat = Object.assign({}, p, {
          invoices: invList,
          invoicesFromList: fromList,
          invoicedToDate: invoicedTotal,
          revenueRecognized: invoicedTotal,
          clientId: c.id,
          clientName: c.name,
          projectName: p.name || "GEO Engagement",
          projectCount: projs.length,
          invoiceMode: p.invoiceMode === "manual" ? "manual" : "auto",
          invoiceStatusManual: p.invoiceStatus || "Not Scheduled",
          invoiceStatus: effectiveInvoiceStatus(Object.assign({}, p, {invoicedToDate: invoicedTotal})),
          roles: normalizeRoles(p.roles),
          logoSvg: c.logoSvg || "",
          logoImg: c.logoImg || "",
          order: c.order
        });
        flat.name = projs.length > 1 ? c.name + " · " + flat.projectName : c.name;
        out.push(flat);
      });
    });
    return out;
  }

  function loadAccounts(){
    return apiFetch("/api/accounts").then(function(list){
      clients = list;
      accounts = flattenClients(list);
      renderAll();
    }).catch(function(err){
      showToast("Load failed: " + err.message, "error");
    });
  }

  function jsonReq(method, body){
    return {method: method, headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)};
  }

  function updateAccount(id, patch, opts){
    var a = getAccount(id);
    if (!a) return Promise.resolve();
    var silent = opts && opts.silent;
    var clientPatch = {}, projPatch = {};
    Object.keys(patch).forEach(function(k){
      if (k === "logoSvg" || k === "logoImg") clientPatch[k] = patch[k];
      else if (k === "clientName") clientPatch.name = patch[k];
      else projPatch[k] = patch[k];
    });
    var base = "/api/accounts/" + encodeURIComponent(a.clientId);
    var calls = [];
    if (Object.keys(projPatch).length) calls.push(apiFetch(base + "/projects/" + encodeURIComponent(id), jsonReq("PATCH", projPatch)));
    if (Object.keys(clientPatch).length) calls.push(apiFetch(base, jsonReq("PATCH", clientPatch)));
    return Promise.all(calls).then(function(){
      return silent ? Promise.resolve() : loadAccounts();
    }).then(function(){
      if (!silent) showToast("Saved", "success");
    }).catch(function(err){
      showToast("Save failed: " + err.message, "error");
      throw err;
    });
  }

      invoiceMode: "auto",
      scopeText: "",
      notes: "",
      ownerOnshore: "",
      ownerOffshore: "",
      roles: DEFAULT_ROLES.map(function(r){ return {role: r, name: "", pct: ""}; }),
      engagementStartDate: null,
      engagementEndDate: null,
      weeks: {}

  // New client with its first project. Returns the project id.
  function createAccount(data, opts){
    var silent = opts && opts.silent;
    var clientId = uniqueClientId(data.clientName);
    var projectId = clientId + "-1";
    var project = Object.assign(newProjectFields(), data.project, {id: projectId});
    var doc = {name: data.clientName, order: Date.now(), logoSvg: "", logoImg: "", projects: [project]};
    return apiFetch("/api/accounts/" + encodeURIComponent(clientId), jsonReq("PUT", doc)).then(function(){
      return silent ? Promise.resolve() : loadAccounts();
    }).then(function(){
      if (!silent) showToast("Account created", "success");
      return projectId;
    }).catch(function(err){
      showToast("Create failed: " + err.message, "error");

  function addProject(clientId, data){
    var project = Object.assign(newProjectFields(), data);
    return apiFetch("/api/accounts/" + encodeURIComponent(clientId) + "/projects", jsonReq("POST", project)).then(function(created){
      return loadAccounts().then(function(){
        showToast("Project added", "success");
        return created.id;
      });
    }).catch(function(err){
      showToast("Add failed: " + err.message, "error");
    });
  }

  function uniqueClientId(name){
    var base = slugify(name);
    var existing = new Set(clients.map(function(c){ return c.id; }));
    if (!existing.has(base)) return base;
    var n = 2;
    while (existing.has(base + "-" + n)) n++;
    return base + "-" + n;
  }

  // ---------------- Excel import ----------------
  // Reads the weekly status workbook entirely in the browser (SheetJS, loaded
  // on demand) and maps its "Account" table onto existing clients/projects.
  var xlsxLibPromise = null;
  function loadXlsxLib(){
    if (window.XLSX) return Promise.resolve();
    if (!xlsxLibPromise) {
      xlsxLibPromise = new Promise(function(resolve, reject){
        var s = document.createElement("script");
        s.src = "vendor/xlsx.full.min.js";
        s.onload = function(){ resolve(); };
        s.onerror = function(){ reject(new Error("Could not load the Excel reader library.")); };
        document.head.appendChild(s);
      });
    }
    return xlsxLibPromise;
  }

  function normHeaderKey(raw){
    return String(raw == null ? "" : raw).toLowerCase().replace(/[–—]/g, "-").replace(/\s+/g, " ").trim();
  }

  var IMPORT_FIELD_MAP = {
    "owner - onshore": "ownerOnshore",
    "owner onshore": "ownerOnshore",
    "owner - offshore": "ownerOffshore",
    "owner offshore": "ownerOffshore",
    "sow status": "sowStatus",
    "revenue": "revenue",
    "invoiced to date": "invoicedToDate",
    "next invoice due": "nextInvoiceDue",
    "invoice status": "invoiceStatus",
    "project status": "projectStatus",
    "scope of work (sow)": "scopeText",
    "scope of work": "scopeText",
    "completed": "completed",
    "in progress": "inProgress",
    "next steps": "nextSteps",
    "key updates": "keyUpdatesBlob",
    "risk": "risk",
    "risk / dependency": "risk",
    "dependency": "risk",
    "risk mitigation steps": "mitigationActions",
    "mitigation steps": "mitigationActions",
    "rag (helper)": "rag",
    "rag": "rag"
  };
  var IMPORT_ROLE_MAP = {
    "engagement lead": "Engagement Lead",
    "geo strategist": "Geo Strategist",
    "consultant": "Consultant",
    "lead analyst": "Lead Analyst",
    "analyst": "Analyst",
    "brand sme": "Brand SME",
    "medical sme": "Medical SME",
    "project manager": "Project Manager"
  };
  var WEEK_PROJECT_FIELDS = ["completed", "inProgress", "nextSteps", "risk", "mitigationActions"];
  var IMPORT_MONTHS = {january:0,february:1,march:2,april:3,may:4,june:5,july:6,august:7,september:8,october:9,november:10,december:11};

  function sheetToRows(wb, sheetName){
    return window.XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header: 1, defval: ""});
  }

  function guessDefaultSheet(sheetNames){
    var bad = /gtm|dashboard|draft|original|list/i;
    for (var i = 0; i < sheetNames.length; i++) {
      if (/\d{1,2}\s*(st|nd|rd|th)?\s+[a-z]+/i.test(sheetNames[i]) && !bad.test(sheetNames[i])) return sheetNames[i];
    }
    return sheetNames[0];
  }

  function findAccountHeaderRow(rows, fromIndex){
    for (var i = fromIndex || 0; i < rows.length; i++) {
      if (normHeaderKey(rows[i][0]) === "account") return i;
    }
    return -1;
  }

  function buildImportColumnMap(rows, headerRowIdx){
    var topRow = rows[headerRowIdx] || [];
    var subRow = rows[headerRowIdx + 1] || [];
    var maxCol = Math.max(topRow.length, subRow.length);
    var map = {};
    for (var c = 0; c < maxCol; c++) {
      var text = normHeaderKey(subRow[c]) || normHeaderKey(topRow[c]);
      if (!text) continue;
      if (IMPORT_ROLE_MAP[text]) map[c] = {role: IMPORT_ROLE_MAP[text]};
      else if (IMPORT_FIELD_MAP[text]) map[c] = {field: IMPORT_FIELD_MAP[text]};
    }
    return map;
  }

  function splitKeyUpdatesBlob(raw){
    var out = {completed: "", inProgress: "", nextSteps: ""};
    if (!raw) return out;
    var paras = String(raw).replace(/\r\n/g, "\n").split(/\n{2,}/).map(function(p){ return p.trim(); }).filter(Boolean);
    var headingMap = {"completed": "completed", "in progress": "inProgress", "next steps": "nextSteps"};
    var bucket = "completed", buckets = {completed: [], inProgress: [], nextSteps: []};
    paras.forEach(function(p){
      var key = normHeaderKey(p);
      if (headingMap[key]) { bucket = headingMap[key]; return; }
      buckets[bucket].push(p);
    });
    out.completed = buckets.completed.join("\n\n");
    out.inProgress = buckets.inProgress.join("\n\n");
    out.nextSteps = buckets.nextSteps.join("\n\n");
    return out;
  }

  function parseDateCell(v){
    if (!v && v !== 0) return null;
    if (v instanceof Date) return isNaN(v.getTime()) ? null : isoFromDate(v);
    var d = new Date(v);
    return isNaN(d.getTime()) ? null : isoFromDate(d);
  }

  function numOrUndef(v){
    if (v === "" || v == null) return undefined;
    var n = Number(v);
    return isNaN(n) ? undefined : n;
  }

  function parseSheetWeekKey(sheetName){
    var m = String(sheetName).toLowerCase().match(/(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]+)/);
    if (!m) return currentWeekKey();
    var day = parseInt(m[1], 10), month = IMPORT_MONTHS[m[2]];
    if (month === undefined) return currentWeekKey();
    var now = new Date(), candidate = new Date(now.getFullYear(), month, day);
    if (candidate.getTime() - now.getTime() > 200 * 24 * 3600 * 1000) candidate = new Date(now.getFullYear() - 1, month, day);
    return isoFromDate(mondayOf(candidate));
  }

  // Parses the first "Account" table in the chosen sheet into one entry per row.
  function parseImportSheet(wb, sheetName){
    var rows = sheetToRows(wb, sheetName);
    var headerRowIdx = findAccountHeaderRow(rows, 0);
    if (headerRowIdx === -1) throw new Error('No "Account" column found on this sheet.');
    var colMap = buildImportColumnMap(rows, headerRowIdx);
    var weekKey = parseSheetWeekKey(sheetName);
    var dataStart = headerRowIdx + 2;
    var dataEnd = findAccountHeaderRow(rows, dataStart);
    if (dataEnd === -1) dataEnd = rows.length;

    var entries = [];
    for (var r = dataStart; r < dataEnd; r++) {
      var row = rows[r];
      var accountName = String(row[0] || "").trim();
      if (!accountName) continue;

      var fields = {}, roleCells = {};
      Object.keys(colMap).forEach(function(cStr){
        var c = Number(cStr), target = colMap[c], v = row[c];
        if (v === "" || v == null) return;
        if (target.role) { roleCells[target.role] = v; return; }
        fields[target.field] = v;
      });

      var projPatch = {};
      if (fields.ownerOnshore) projPatch.ownerOnshore = String(fields.ownerOnshore).trim();
      if (fields.ownerOffshore) projPatch.ownerOffshore = String(fields.ownerOffshore).trim();
      if (fields.sowStatus) projPatch.sowStatus = String(fields.sowStatus).trim();
      if (fields.projectStatus) projPatch.projectStatus = String(fields.projectStatus).trim();
      if (fields.scopeText) projPatch.scopeText = String(fields.scopeText).trim();
      var ragRaw = fields.rag ? String(fields.rag).trim() : "";
      var ragMatch = ["Green", "Amber", "Red"].find(function(r){ return r.toLowerCase() === ragRaw.toLowerCase(); });
      if (ragMatch) projPatch.rag = ragMatch;
      var rev = numOrUndef(fields.revenue); if (rev !== undefined) projPatch.revenue = rev;
      var inv = numOrUndef(fields.invoicedToDate); if (inv !== undefined) projPatch.invoicedToDate = inv;
      var nid = parseDateCell(fields.nextInvoiceDue); if (nid) projPatch.nextInvoiceDue = nid;
      var importedInvoiceStatus = fields.invoiceStatus ? String(fields.invoiceStatus).trim() : "";

      // Key-updates columns are often merged in this template, so whichever of
      // Completed/In Progress/Next Steps actually holds text may be the only
      // one filled in for a row. One populated column -> split it by its
      // inline "Completed"/"In Progress"/"Next Steps" headings, if any,
      // falling back to Completed. Several populated columns -> genuinely
      // separate entries, so keep them as-is.
      var weekPatch = {};
      var cuFields = ["completed", "inProgress", "nextSteps"];
      var cuFilled = cuFields.filter(function(f){ return fields[f] !== undefined && String(fields[f]).trim(); });
      if (cuFilled.length === 1) {
        Object.assign(weekPatch, splitKeyUpdatesBlob(fields[cuFilled[0]]));
      } else if (cuFilled.length > 1) {
        cuFilled.forEach(function(f){ weekPatch[f] = String(fields[f]).trim(); });
      } else if (fields.keyUpdatesBlob !== undefined) {
        Object.assign(weekPatch, splitKeyUpdatesBlob(fields.keyUpdatesBlob));
      }
      if (fields.risk !== undefined) weekPatch.risk = String(fields.risk).trim();
      if (fields.mitigationActions !== undefined) weekPatch.mitigationActions = String(fields.mitigationActions).trim();

      var rolesInput = Object.keys(roleCells).map(function(roleName){ return {role: roleName, value: String(roleCells[roleName])}; });
      var roles = rolesInput.length ? normalizeRoles(rolesInput) : null;

      var matchedClient = clients.find(function(c){ return normHeaderKey(c.name) === normHeaderKey(accountName); }) || null;
      if (importedInvoiceStatus) {
        var existingProj = matchedClient ? (accounts.find(function(a){ return a.clientId === matchedClient.id; }) || {}) : {};
        var autoResult = autoInvoiceStatus(
          projPatch.revenue !== undefined ? projPatch.revenue : existingProj.revenue,
          projPatch.invoicedToDate !== undefined ? projPatch.invoicedToDate : existingProj.invoicedToDate,
          projPatch.nextInvoiceDue !== undefined ? projPatch.nextInvoiceDue : existingProj.nextInvoiceDue);
        if (normHeaderKey(importedInvoiceStatus) !== normHeaderKey(autoResult)) {
          projPatch.invoiceStatus = importedInvoiceStatus;
          projPatch.invoiceMode = "manual";
        }
      }

      entries.push({
        accountName: accountName,
        clientId: matchedClient ? matchedClient.id : null,
        isNew: !matchedClient,
        projPatch: projPatch,
        weekPatch: weekPatch,
        roles: roles,
        weekKey: weekKey
      });
    }
    return {weekKey: weekKey, entries: entries};
  }

  function describeImportRow(entry){
    var parts = [];
    var fieldLabels = {ownerOnshore: "Owner (onshore)", ownerOffshore: "Owner (offshore)", sowStatus: "SOW status", revenue: "Revenue", invoicedToDate: "Invoiced to date", nextInvoiceDue: "Next invoice due", invoiceStatus: "Invoice status", invoiceMode: "Invoice status mode", projectStatus: "Project status", scopeText: "Scope of work", rag: "RAG"};
    Object.keys(entry.projPatch).forEach(function(k){ parts.push(fieldLabels[k] || k); });
    var weekLabels = {completed: "Completed", inProgress: "In progress", nextSteps: "Next steps", risk: "Risk", mitigationActions: "Mitigation actions"};
    Object.keys(entry.weekPatch).forEach(function(k){ if (entry.weekPatch[k]) parts.push(weekLabels[k] || k); });
    if (entry.roles && entry.roles.length) parts.push("Team allocation");
    return parts;
  }

  var importState = null;

  function openImportModal(){
    importState = {wb: null, sheetNames: [], parsed: null};

  function handleImportFile(file){

  function renderImportPreview(){
    var parsed = importState.parsed;
    var entries = parsed.entries;
    var newCount = entries.filter(function(e){ return e.isNew; }).length;
    $("#import-preview-summary").textContent =
      entries.length + " row" + (entries.length === 1 ? "" : "s") + " found for " + weekLabel(parsed.weekKey) +
      " — " + (entries.length - newCount) + " will update an existing account, " + newCount + " will be created as new.";
    $("#import-preview-list").innerHTML = entries.map(function(e, i){
      var changes = describeImportRow(e);
      return '<div class="import-row' + (e.isNew ? " is-new" : "") + '">' +
        '<div class="import-row-head">' +
          '<span class="import-row-name">' + esc(e.accountName) + '</span>' +
          '<label style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--neutral-600);">' +
            '<input type="checkbox" data-import-toggle="' + i + '" checked> ' + (e.isNew ? "Create new account" : "Update existing") +
          '</label>' +
        '</div>' +
        '<div class="import-row-changes">' + (changes.length ? "Will set: " + changes.map(esc).join(", ") : "No recognized fields on this row — nothing to change.") + '</div>' +
      '</div>';
    }).join("");
  }

  function applyImport(){
    var entries = importState.parsed.entries.filter(function(e, i){
      var cb = $('[data-import-toggle="' + i + '"]');
      return !cb || cb.checked;
    });
    $("#import-apply-btn").disabled = true;
    $("#import-apply-btn").textContent = "Importing…";

    var created = 0, updated = 0, failed = [];
    var chain = Promise.resolve();
    entries.forEach(function(e){
      chain = chain.then(function(){
        var weekEntryBase = {completed: "", inProgress: "", nextSteps: "", risk: "", mitigationActions: "", mitigationDeadline: null, scopeCreep: "", changeRequests: ""};
        if (e.isNew) {
          var weeks = {};
          weeks[e.weekKey] = Object.assign({}, weekEntryBase, e.weekPatch);
          if ("risk" in e.weekPatch || "mitigationActions" in e.weekPatch) weeks[e.weekKey].riskSaved = true;
          var projectData = Object.assign({}, e.projPatch, {weeks: weeks});
          if (e.roles && e.roles.length) projectData.roles = e.roles;
          return createAccount({clientName: e.accountName, project: projectData}, {silent: true}).then(function(){ created++; });
        }
        var acc = accounts.find(function(a){ return a.clientId === e.clientId; });
        if (!acc) { failed.push(e.accountName + " (no project found)"); return; }
        var patch = Object.assign({}, e.projPatch);
        if (Object.keys(e.weekPatch).length) {
          var existingWeek = weekData(acc, e.weekKey);
          var newWeek = Object.assign({}, existingWeek, e.weekPatch);
          if ("risk" in e.weekPatch || "mitigationActions" in e.weekPatch) newWeek.riskSaved = true;
          var newWeeks = Object.assign({}, acc.weeks || {});
          newWeeks[e.weekKey] = newWeek;
          patch.weeks = newWeeks;
        }
        if (e.roles && e.roles.length) patch.roles = e.roles;
        if (!Object.keys(patch).length) return;
        return updateAccount(acc.id, patch, {silent: true}).then(function(){ updated++; }).catch(function(){ failed.push(e.accountName); });
      });
    });

    chain.then(function(){
      return loadAccounts();
    }).then(function(){
      $("#import-apply-btn").disabled = false;
      $("#import-apply-btn").textContent = "Apply import";
      $("#import-step-preview").hidden = true;
      $("#import-step-done").hidden = false;
      var msg = "Updated " + updated + " account" + (updated === 1 ? "" : "s") + " and created " + created + " new one" + (created === 1 ? "" : "s") + " for " + weekLabel(importState.parsed.weekKey) + ".";
      if (failed.length) msg += " Could not import: " + failed.join(", ") + ".";
      $("#import-done-summary").textContent = msg;
    });
  }

  // Deletes one project; removes the client too when it was the last one.
  function deleteAccount(id){
    var a = getAccount(id);
    if (!a) return Promise.resolve();
    var last = a.projectCount <= 1;
    var url = last ? "/api/accounts/" + encodeURIComponent(a.clientId)
                   : "/api/accounts/" + encodeURIComponent(a.clientId) + "/projects/" + encodeURIComponent(id);
    return apiFetch(url, {method: "DELETE"}).then(function(){
      return loadAccounts();
    }).then(function(){
      showToast(last ? "Account deleted" : "Project deleted", "success");
    }).catch(function(err){

  }

  // ---- utilization: parsed live from each account's Team tab, not a static import ----
  function utilStatus(pct){
    if (pct <= 0) return {label:"Unallocated", tag:"tag-neutral"};
    if (pct > 1) return {label:"Overbooked", tag:"tag-error"};
    if (pct >= 0.99) return {label:"Fully Booked", tag:"tag-primary"};
    if (pct >= 0.75) return {label:"Balanced", tag:"tag-success"};
    return {label:"Underbooked", tag:"tag-warning"};
  }

  function computeUtilization(){
    var byPerson = {};
    // One entry per person, matched ignoring case and extra spaces, with one
    // slice per project (a person listed twice in a project is summed).
    accounts.forEach(function(a){
      (a.roles || []).forEach(function(r){
        var pname = (r.name || "").trim().replace(/\s+/g, " "), ppct = (Number(r.pct) || 0) / 100;
        if (!pname || ppct <= 0) return;
        var key = pname.toLowerCase();
        if (!byPerson[key]) byPerson[key] = {name: pname, totalPct: 0, accounts: []};
        byPerson[key].totalPct += ppct;
        var slice = byPerson[key].accounts.find(function(x){ return x.id === a.id; });
        if (slice) {
          slice.pct += ppct;
          if (slice.role.split(" / ").indexOf(r.role) === -1) slice.role += " / " + r.role;
        } else {
          byPerson[key].accounts.push({id: a.id, account: a.name, role: r.role, pct: ppct});
        }
      });
    });
    var list = Object.keys(byPerson).map(function(k){ return byPerson[k]; });
    list.sort(function(x, y){ return y.totalPct - x.totalPct; });
    return list;
  }

  function computeRiskWatch(){
    return accounts.map(function(a){
      var hit = latestNonEmptyWeek(a, "risk");
      return hit ? {a: a, weekKey: hit.weekKey, risk: hit.value} : null;
    }).filter(Boolean).sort(function(x, y){ return y.weekKey.localeCompare(x.weekKey); });
  }

  function computeScopeCreepWatch(){
    return accounts.map(function(a){
      var hit = latestNonEmptyWeek(a, "scopeCreep");
      return hit ? {a: a, weekKey: hit.weekKey, note: hit.value} : null;
    }).filter(Boolean).sort(function(x, y){ return y.weekKey.localeCompare(x.weekKey); });
  }

  function computeUpcomingInvoices(){
    return accounts.filter(function(a){ return a.nextInvoiceDue; })
      .sort(function(x, y){ return (x.nextInvoiceDue||"").localeCompare(y.nextInvoiceDue||""); });
  }

          bars + '</div>' +

  function visibleAccounts(){
    var term = searchTerm.trim().toLowerCase();
    var list = accounts.filter(function(a){
      if (filterRag !== "All" && ragClass(a.rag) !== filterRag) return false;
      if (!term) return true;
      var hay = [a.clientName, a.projectName, a.sowStatus, a.projectStatus].join(" ").toLowerCase();
      return hay.indexOf(term) > -1;
    });
    list.sort(function(x, y){
      if (sortMode === "name") return (x.name||"").localeCompare(y.name||"");
      if (sortMode === "revenue") return (Number(y.revenue)||0) - (Number(x.revenue)||0);
      if (sortMode === "order") return (Number(x.order)||0) - (Number(y.order)||0);
      var sx = RAG_SEVERITY[ragClass(x.rag)];
      var sy = RAG_SEVERITY[ragClass(y.rag)];
      if (sx !== sy) return sx - sy;
      return (Number(y.revenue)||0) - (Number(x.revenue)||0);
    });
    return list;
  }

  function engagementProgress(a){
    if (!a.engagementStartDate || !a.engagementEndDate) return null;
    var start = new Date(a.engagementStartDate + "T00:00:00").getTime();
    var end = new Date(a.engagementEndDate + "T00:00:00").getTime();
    if (isNaN(start) || isNaN(end) || end <= start) return null;
    var now = Date.now();
    var pct = Math.round(((now - start) / (end - start)) * 100);
    return {pct: Math.max(0, Math.min(100, pct)), raw: pct};
