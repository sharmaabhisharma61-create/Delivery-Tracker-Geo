databases:
  - name: geo-tracker-db
    plan: free
    databaseName: geo_tracker
    user: geo_tracker

services:
  - type: web
    name: geo-delivery-tracker
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geo-tracker-db
          property: connectionString
